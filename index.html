    const subjectSelect = document.getElementById("planSubject");
    const materialSelect = document.getElementById("planMaterial");
    function refreshPageInputs(resetValues) {
      const nextMaterial = materialById(materialSelect.value);
      if (!nextMaterial) return;
      const startInput = document.getElementById("planStartPage");
      const endInput = document.getElementById("planEndPage");
      startInput.max = nextMaterial.totalPages;
      endInput.max = nextMaterial.totalPages;
      if (resetValues) {
        const start = Math.min(nextMaterial.totalPages, Math.max(1, nextMaterial.completedPages + 1));

        endInput.value = Math.min(nextMaterial.totalPages, start + 9);

    }
    subjectSelect.addEventListener("change", () => {
      materialSelect.innerHTML = renderMaterialOptions(subjectSelect.value, "");
      refreshPageInputs(true);
    });
    materialSelect.addEventListener("change", () => refreshPageInputs(true));

    document.getElementById("planForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const date = document.getElementById("planDate").value;
      const nextMaterial = materialById(document.getElementById("planMaterial").value);
      const startPage = Math.max(1, Math.round(Number(document.getElementById("planStartPage").value) || 1));

  function infoRowsToText(rows, keys) {
    return rows.map((row) => keys.map((key) => String(row[key] || "").replace(/\|/g, "／")).join(" | ")).join("\n");
  }

  function parseInfoRows(text, keys) {
    return String(text || "").split(/\r?\n/).map((line) => line.trim()).filter(Boolean).map((line) => {
      const parts = line.split("|").map((part) => part.trim());
      const row = {};
      keys.forEach((key, index) => {
        row[key] = parts[index] || "";
      });
      return row;
    });
  }

        ${shareUrl ? `<div class="cloud-row" style="display:block">
          <strong style="font-size:12px">다른 기기용 공유 주소</strong>
          <div class="share-link"><input class="form-control" id="shareUrl" readonly value="${esc(shareUrl)}"><button class="soft-btn" data-action="copy-share">복사</button></div>
          <small style="display:block;margin-top:6px;color:var(--brick)">보안을 위해 키는 주소에 넣지 않습니다. 새 기기에서 같은 키를 따로 입력하세요.</small>
        </div>` : ""}
        <div class="cloud-row">
          <span><strong>데이터 크기</strong><small style="display:block;color:var(--muted);margin-top:3px">${sizeKb}KB · 정기 백업 권장</small></span>
          <div class="inline-actions">
            <button class="soft-btn" data-action="export-backup">JSON 백업</button>
            <button class="soft-btn" data-action="import-backup">JSON 병합</button>
            <input id="backupInput" type="file" accept=".json,application/json" hidden>
            ${cloud.binId && cloud.key ? `<button class="soft-btn" data-action="sync-now">지금 동기화</button><button class="danger-btn" data-action="disconnect-cloud">연결 해제</button>` : ""}
          </div>
        </div>
        ${sizeKb >= 85 ? `<div class="cloud-help" style="color:var(--brick)">현재 데이터가 ${sizeKb}KB입니다. JSON 백업을 내려받고 저장 용량을 확인해 주세요.</div>` : ""}
      </div>
      <div class="modal-actions"><button class="soft-btn" data-action="close-modal">닫기</button></div>`, { wide: true });
  }

  function applyTheme(theme) {
    document.documentElement.classList.toggle("dark", theme === "dark");
    localStorage.setItem(THEME_KEY, theme);
  }

  function cloudHeaders(contentType) {
    const headers = {};
    headers[cloud.keyType === "master" ? "X-Master-Key" : "X-Access-Key"] = cloud.key;
    if (contentType) headers["Content-Type"] = "application/json";
    return headers;
  }

  async function apiError(response) {
    let detail = "";
    try {
      const body = await response.clone().json();
      detail = String((body && (body.message || body.error)) || "").trim();
    } catch (_) {
      // JSONBin이 오류 본문을 주지 않으면 상태 코드만 표시합니다.
    }
    return detail ? `${response.status} · ${detail}` : String(response.status);
  }

  function remoteStateFromRecord(record) {
    if (!record || typeof record !== "object") return null;
    const value = record.studyCoachState;
    if (value == null) return null;
    if (typeof value === "string") {
      try {
        return normalizeState(JSON.parse(value));
      } catch (_) {
        throw new Error("클라우드 데이터 형식 오류");
      }
    }
    if (!value || typeof value !== "object") throw new Error("클라우드 데이터 형식 오류");
    return normalizeState(value);
  }

  function saveMergedState(nextState) {
    state = normalizeState(nextState);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  async function fetchRemoteRecord() {
    const response = await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(cloud.binId)}/latest`, { headers: cloudHeaders(false) });
    if (!response.ok) throw new Error(await apiError(response));
    const json = await response.json();
    return json.record || {};
  }

  async function pullCloud(options) {
    const settings = options || {};
    if (!cloud.binId || !cloud.key) return false;
    cloud.status = "불러오는 중";
    renderTopOnly();
    try {
      const record = await fetchRemoteRecord();
      const remoteState = remoteStateFromRecord(record);
      const merged = remoteState ? mergeStates(state, remoteState) : normalizeState(state);
      const needsPush = !remoteState || stateFingerprint(merged) !== stateFingerprint(remoteState);
      saveMergedState(merged);
      cloudCanPush = true;
      cloud.pending = needsPush;
      cloud.status = needsPush ? "변경사항 업로드 대기" : "동기화 완료";
      cloud.lastSync = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
      saveCloudConfig();
      render();
      if (!settings.silent) showToast("클라우드 데이터를 불러왔습니다.");
      return true;
    } catch (error) {
      cloudCanPush = false;
      cloud.status = `불러오기 실패 (${error.message})`;
      saveCloudConfig();
      renderTopOnly();
      if (!settings.silent) showToast("클라우드 연결을 확인해 주세요.");
      return false;
    }
  }

  function scheduleCloudPush() {
    clearTimeout(cloudPushTimer);
    cloudPushTimer = setTimeout(pushCloud, 1400);
  }

  async function pushCloud() {
    if (!cloudCanPush || !cloud.binId || !cloud.key || cloudPushRunning) return false;
    cloudPushRunning = true;
    cloud.status = "저장 중";
    renderTopOnly();
    try {
      const remoteRecord = await fetchRemoteRecord();
      const remoteState = remoteStateFromRecord(remoteRecord);
      let merged = remoteState ? mergeStates(state, remoteState) : normalizeState(state);
      let payload = { ...remoteRecord, studyCoachState: merged };
      let response = await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(cloud.binId)}`, {
        method: "PUT",
        headers: cloudHeaders(true),
        body: JSON.stringify(payload),
      });
      if (!response.ok) throw new Error(await apiError(response));
      const verifiedRecord = await fetchRemoteRecord();
      const verifiedState = remoteStateFromRecord(verifiedRecord);
      if (!verifiedState) throw new Error("저장 확인 실패");
      const union = mergeStates(merged, verifiedState);
      if (stateFingerprint(union) !== stateFingerprint(verifiedState)) {
        payload = { ...verifiedRecord, studyCoachState: union };
        response = await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(cloud.binId)}`, {
          method: "PUT",
          headers: cloudHeaders(true),
          body: JSON.stringify(payload),
        });
        if (!response.ok) throw new Error(await apiError(response));
      }
      merged = union;
      saveMergedState(merged);
      cloud.pending = false;
      cloud.status = "동기화 완료";
      cloud.lastSync = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
      saveCloudConfig();
      render();
      return true;
    } catch (error) {
      cloudCanPush = false;
      cloud.pending = true;
      cloud.status = `저장 실패 (${error.message})`;
      saveCloudConfig();
      renderTopOnly();
      showToast("로컬에는 저장했습니다. 연결 후 ‘지금 동기화’를 눌러 주세요.");
      return false;
    } finally {
      cloudPushRunning = false;
    }
  }

  async function autoSyncCloud(options) {
    const settings = options || {};
    if (!cloud.binId || !cloud.key || autoSyncRunning || cloudPushRunning) return false;
    if (!settings.force && Date.now() - lastAutoPullAt < 10000) return false;
    autoSyncRunning = true;
    lastAutoPullAt = Date.now();
    try {
      const pulled = await pullCloud({ silent: true });
      if (!pulled) return false;
      if (cloud.pending) return pushCloud();
      return true;
    } finally {
      autoSyncRunning = false;
    }
  }

  async function connectCloud(createNew) {
    const keyType = document.getElementById("cloudKeyType")?.value || "access";
    const key = document.getElementById("cloudKeyInput")?.value.trim() || "";
    const binId = document.getElementById("cloudBinInput")?.value.trim() || "";
    if (!key) return showToast("JSONBin Key를 입력해 주세요.");
    const previousBinId = cloud.binId;
    cloud.keyType = keyType;
    cloud.key = key;
    if (createNew) {
      cloud.status = "새 Bin 생성 중";
      renderTopOnly();
      try {
        const response = await fetch("https://api.jsonbin.io/v3/b", {
          method: "POST",
          headers: { ...cloudHeaders(true), "X-Bin-Name": "suneung-weekbook", "X-Bin-Private": "true" },
          body: JSON.stringify({ studyCoachState: state }),
        });
        if (!response.ok) throw new Error(await apiError(response));
        const json = await response.json();
        cloud.binId = json.metadata && json.metadata.id ? json.metadata.id : "";
        if (!cloud.binId) throw new Error("Bin ID 없음");
        switchStateStorage(cloud.binId, { keepCurrent: true });
        cloudCanPush = true;
        cloud.pending = false;
        cloud.status = "저장 권한 확인 중";
        cloud.lastSync = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
        saveCloudConfig();
        const writable = await pushCloud();
        openCloudModal();
        showToast(writable ? "새 클라우드 저장소를 만들고 연결했습니다." : "Bin은 만들었지만 저장 권한을 확인해 주세요.");
      } catch (error) {
        cloudCanPush = false;
        cloud.status = `생성 실패 (${error.message})`;
        saveCloudConfig();
        openCloudModal();
        showToast("키의 Bin 생성 권한을 확인해 주세요.");
      }
      return;
    }
    if (!binId) return showToast("Bin ID를 입력해 주세요.");
    if (binId !== previousBinId) switchStateStorage(binId, { keepCurrent: false });
    cloud.binId = binId;
    saveCloudConfig();
    const ok = await pullCloud({ silent: false });
    if (ok && cloud.pending) await pushCloud();
    openCloudModal();
  }

  function makeShareUrl() {
    const url = new URL(location.href);
    url.hash = `bin=${encodeURIComponent(cloud.binId)}`;
    return url.toString();
  }

  function exportBackup() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    link.href = url;
    link.download = `suneung-weekbook-${todayKey}.json`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 500);
    showToast("JSON 백업 파일을 저장했습니다.");
  }

  async function importBackup(file) {
    if (!file) return;
    try {
      const parsed = JSON.parse(await file.text());
      if (!parsed || typeof parsed !== "object") throw new Error("invalid");
      if (!confirm("백업 데이터를 현재 기록과 안전하게 병합할까요? 현재 기록은 유지됩니다.")) return;
      saveMergedState(mergeStates(state, parsed));
      persist();
      closeModal();
      render();
      showToast("백업 데이터를 병합했습니다.");
    } catch (_) {
      showToast("읽을 수 있는 민서의 학습 노트 JSON 파일이 아닙니다.");
    }
  }

  async function syncNow() {
    const synced = await autoSyncCloud({ force: true });
    openCloudModal();
    if (synced) showToast("최신 데이터로 동기화했습니다.");
    else showToast("클라우드 연결 상태를 확인해 주세요.");
  }

  function navigate(page) {
    ui.page = page;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function removeMaterial(id) {
    const material = materialById(id);
    if (!material) return;
    const linkedPlans = state.plans.filter((plan) => plan.taskId === id);
    const studyMinutes = material.studyLogs.reduce((sum, log) => sum + log.minutes, 0);
    const warning = `‘${material.title}’ 교재를 삭제하면 연결된 주간 학습 ${linkedPlans.length}개와 공부시간 ${C.formatMinutes(studyMinutes)}도 함께 삭제됩니다. 계속할까요?`;
    if (!confirm(warning)) return;
    const stamp = nowIso();
    state.tasks = state.tasks.filter((item) => item.id !== id);
    state.tombstones.tasks[id] = stamp;
    linkedPlans.forEach((plan) => {
      state.tombstones.plans[plan.id] = stamp;
    });
    state.plans = state.plans.filter((plan) => plan.taskId !== id);
    persist();
    render();
    showToast("교재와 연결 기록을 삭제했습니다.");
  }

  function setPlanCompletion(plan, completed) {
    const material = materialById(plan.taskId);
    if (!material) return;
    const stamp = nowIso();
    plan.completed = completed;
    plan.updatedAt = stamp;
    if (completed) {
      material.completedPages = Math.max(material.completedPages, plan.endPage);
      material.completed = material.completedPages >= material.totalPages;
      material.updatedAt = stamp;
    }
    persist();
    render();
    showToast(completed ? "주간 학습을 완료했습니다." : "완료 표시를 취소했습니다.");
  }

  function addStudyLog(material, values) {
    const date = values.date;
    const hours = Math.max(0, Math.round(Number(values.hours) || 0));
    const minutesPart = Math.max(0, Math.round(Number(values.minutesPart) || 0));
    if (!date) return showToast("공부 날짜를 선택해 주세요.");
    if (hours > 23 || minutesPart > 59) return showToast("시간은 0~23, 분은 0~59로 입력해 주세요.");
    const minutes = hours * 60 + minutesPart;
    if (!minutes) return showToast("0분은 기록할 수 없습니다.");
    if (dailyTotal(date) + minutes > 1440 && !confirm("이 날짜의 총 공부시간이 24시간을 넘습니다. 그래도 기록할까요?")) return;
    const stamp = nowIso();
    material.studyLogs.push({
      id: C.newId("log"),
      planId: values.planId || "",
      date,
      minutes,
      createdAt: stamp,
      updatedAt: stamp,
    });
    material.updatedAt = stamp;
    persist();
    return true;
  }

  document.addEventListener("click", async function (event) {
    const target = event.target.closest("[data-action]");
    if (!target) return;
    const action = target.dataset.action;

    if (action === "close-modal") {
      if (target.matches("[data-modal-panel]")) return;
      if (target.classList.contains("modal-backdrop") && event.target.closest("[data-modal-panel]")) return;
      return closeModal();
    }
    if (action === "navigate") return navigate(target.dataset.page);
    if (action === "toggle-theme") {
      applyTheme(document.documentElement.classList.contains("dark") ? "light" : "dark");
      return render();
    }
    if (action === "open-cloud") return openCloudModal();
    if (action === "toggle-common") {
      ui.commonCollapsed = !ui.commonCollapsed;
      return render();
    }
    if (action === "mini-month-prev") {
      ui.miniMonth = moveMonth(ui.miniMonth, -1);
      return render();
    }
    if (action === "mini-month-next") {
      ui.miniMonth = moveMonth(ui.miniMonth, 1);
      return render();
    }
    if (action === "mini-month-today") {
      ui.miniMonth = `${todayKey.slice(0, 7)}-01`;
      return render();
    }
    if (action === "select-date") {
      ui.selectedDate = target.dataset.date;
      ui.studyWeek = C.weekKey(ui.selectedDate);
      ui.miniMonth = `${ui.selectedDate.slice(0, 7)}-01`;
      ui.page = "weekly";
      return render();
    }
    if (action === "open-dday") return openDdayModal("");
    if (action === "edit-dday") return openDdayModal(target.dataset.id);
    if (action === "delete-dday") {
      if (!confirm("이 D-Day를 삭제할까요?")) return;
      state.ddays = state.ddays.filter((item) => item.id !== target.dataset.id);
      state.tombstones.ddays[target.dataset.id] = nowIso();
      persist();
      render();
      return showToast("D-Day를 삭제했습니다.");
    }
    if (action === "week-prev") {
      ui.selectedDate = C.toDateKey(C.addDays(ui.selectedDate, -7));
      return render();
    }
    if (action === "week-next") {
      ui.selectedDate = C.toDateKey(C.addDays(ui.selectedDate, 7));
      return render();
    }
    if (action === "week-today") {
      ui.selectedDate = todayKey;
      return render();
    }
    if (action === "save-week-notes") {
      const key = C.weekKey(ui.selectedDate);
      const field = target.dataset.noteField === "teacher" ? "teacher" : "student";
      const existing = state.weeklyNotes[key] || {
        student: "",
        teacher: "",
        studentUpdatedAt: "",
        teacherUpdatedAt: "",
        updatedAt: "",
      };
      const stamp = nowIso();
      const inputId = field === "teacher" ? "teacherWeekNote" : "studentWeekNote";
      existing[field] = document.getElementById(inputId)?.value || "";
      existing[`${field}UpdatedAt`] = stamp;
      existing.updatedAt = stamp;
      state.weeklyNotes[key] = existing;
      persist();
      render();
      return showToast("주간 메모를 저장했습니다.");
    }

    if (action === "open-plan") return openPlanModal("", "", ui.selectedDate);
    if (action === "open-plan-for-material") return openPlanModal("", target.dataset.id, ui.selectedDate);
    if (action === "open-plan-detail") return openPlanDetailModal(target.dataset.id);
    if (action === "edit-plan") {
      const id = target.dataset.id;
      closeModal();
      return openPlanModal(id);
    }
    if (action === "delete-plan") {
      const plan = planById(target.dataset.id);
      if (!plan || !confirm("이 주간 학습 계획을 삭제할까요? 연결된 공부시간은 교재 기록에 유지됩니다.")) return;
      state.plans = state.plans.filter((item) => item.id !== plan.id);
      state.tombstones.plans[plan.id] = nowIso();
      persist();
      closeModal();
      render();
      return showToast("주간 학습을 삭제했습니다.");
    }
    if (action === "complete-plan") return openPlanCompletionModal(target.dataset.id);
    if (action === "toggle-plan-complete") {
      const plan = planById(target.dataset.id);
      if (!plan) return;
      return setPlanCompletion(plan, !plan.completed);
    }
    if (action === "add-plan-log") {
      const plan = planById(target.dataset.id);
      const material = plan && materialById(plan.taskId);
      if (!plan || !material) return;
      const added = addStudyLog(material, {
        planId: plan.id,
        date: document.getElementById("planLogDate")?.value,
        hours: document.getElementById("planLogHour")?.value,
        minutesPart: document.getElementById("planLogMinute")?.value,
      });
      if (added) {
        render();
        openPlanDetailModal(plan.id);
        showToast("공부시간을 기록했습니다.");
      }
      return;
    }

    if (action === "month-prev") {
      ui.monthDate = moveMonth(ui.monthDate, -1);
      return render();
    }
    if (action === "month-next") {
      ui.monthDate = moveMonth(ui.monthDate, 1);
      return render();
    }
    if (action === "month-today") {
      ui.monthDate = `${todayKey.slice(0, 7)}-01`;
      return render();
    }
    if (action === "study-subject-filter") {
      ui.studySubject = target.dataset.id === "all" || state.subjects.some((subject) => subject.id === target.dataset.id)
        ? target.dataset.id
        : "all";
      return render();
    }
    if (action === "study-week-prev") {
      ui.studyWeek = C.toDateKey(C.addDays(ui.studyWeek, -7));
      return render();
    }
    if (action === "study-week-next") {
      ui.studyWeek = C.toDateKey(C.addDays(ui.studyWeek, 7));
      return render();
    }
    if (action === "study-week-today") {
      ui.studyWeek = C.weekKey(todayKey);
      return render();
    }
    if (action === "study-month-prev") {
      ui.studyMonth = moveMonth(ui.studyMonth, -1);
      return render();
    }
    if (action === "study-month-next") {
      ui.studyMonth = moveMonth(ui.studyMonth, 1);
      return render();
    }
    if (action === "open-quick-log") return openQuickLogModal(todayKey);
    if (action === "quick-log-date") return openQuickLogModal(target.dataset.date);
    if (action === "delete-log") {
      const material = materialById(target.dataset.taskId);
      if (!material || !confirm("이 공부시간 기록을 삭제할까요?")) return;
      material.studyLogTombstones[target.dataset.logId] = nowIso();
      material.studyLogs = material.studyLogs.filter((log) => log.id !== target.dataset.logId);
      material.updatedAt = nowIso();
      persist();
      closeModal();
      render();
      return showToast("공부시간 기록을 삭제했습니다.");
    }

    if (action === "open-material") return openMaterialModal("");
    if (action === "edit-material") return openMaterialModal(target.dataset.id);
    if (action === "delete-material") return removeMaterial(target.dataset.id);
    if (action === "view-material") {
      const material = materialById(target.dataset.id);
      if (!material) return;
      ui.page = "learning";
      ui.selectedSubject = material.subjectId;
      ui.selectedCategory = "all";
      ui.learningFilter = "all";
      return render();
    }
    if (action === "select-subject") {
      ui.selectedSubject = target.dataset.id;
      ui.selectedCategory = "all";
      return render();
    }
    if (action === "select-category") {
      ui.selectedCategory = target.dataset.id;
      return render();
    }
    if (action === "set-filter") {
      ui.learningFilter = target.dataset.id;
      return render();
    }
    if (action === "open-categories") return openCategoryModal();
    if (action === "rename-category") {
      const subject = subjectById(ui.selectedSubject);
      const category = subject.categories.find((item) => item.id === target.dataset.id);
      if (!category) return;
      const nextName = prompt("새 하위 항목 이름", category.name);
      if (nextName == null) return;
      const name = nextName.trim();
      if (!name) return showToast("이름을 입력해 주세요.");
      if (subject.categories.some((item) => item.id !== category.id && item.name.toLowerCase() === name.toLowerCase())) return showToast("같은 이름의 하위 항목이 있습니다.");
      category.name = name;
      category.updatedAt = nowIso();
      persist();
      openCategoryModal();
      return showToast("하위 항목 이름을 변경했습니다.");
    }
    if (action === "delete-category") {
      const subject = subjectById(ui.selectedSubject);
      const category = subject.categories.find((item) => item.id === target.dataset.id);
      if (!category || state.tasks.some((material) => material.categoryId === category.id)) return;
      if (!confirm(`‘${category.name}’ 하위 항목을 삭제할까요?`)) return;
      subject.categories = subject.categories.filter((item) => item.id !== category.id);
      state.tombstones.categories[category.id] = nowIso();
      if (ui.selectedCategory === category.id) ui.selectedCategory = "all";
      persist();
      return openCategoryModal();
    }
    if (action === "open-score") return openScoreModal("");
    if (action === "delete-score") {
      if (!confirm("이 모의고사 성적 기록을 삭제할까요?")) return;
      state.examScores = state.examScores.filter((score) => score.id !== target.dataset.id);
      state.tombstones.scores[target.dataset.id] = nowIso();
      persist();
      render();
      return showToast("성적 기록을 삭제했습니다.");
    }
    if (action === "edit-exam-info") return openExamInfoEditor();
    if (action === "reset-exam-info") {
      if (!confirm("수능 정보 페이지를 처음 제공된 2026학년도 공식 기본값으로 되돌릴까요?")) return;
      state.examInfo = defaultExamInfo();
      state.examInfo.updatedAt = nowIso();
      persist();
      closeModal();
      render();
      return showToast("수능 정보를 공식 기본값으로 복원했습니다.");
    }

    if (action === "connect-cloud") return connectCloud(false);
    if (action === "create-cloud") return connectCloud(true);
    if (action === "copy-share") {
      const value = document.getElementById("shareUrl")?.value || makeShareUrl();
      try {
        await navigator.clipboard.writeText(value);
        showToast("공유 주소를 복사했습니다.");
      } catch (_) {
        showToast("주소를 선택해 직접 복사해 주세요.");
      }
      return;
    }
    if (action === "sync-now") return syncNow();
    if (action === "disconnect-cloud") {
      if (!confirm("이 기기에서 클라우드 연결을 해제할까요? 로컬 데이터는 유지됩니다.")) return;
      switchStateStorage("", { keepCurrent: true });
      cloud = { binId: "", key: "", keyType: "access", status: "로컬 저장", lastSync: "", pending: false };
      cloudCanPush = false;
      saveCloudConfig();
      closeModal();
      render();
      return showToast("클라우드 연결을 해제했습니다.");
    }
    if (action === "export-backup") return exportBackup();
    if (action === "import-backup") {
      document.getElementById("backupInput")?.click();
      return;
    }
  });

  document.addEventListener("change", (event) => {
    if (event.target && event.target.id === "backupInput") importBackup(event.target.files?.[0]);
  });

  window.addEventListener("storage", (event) => {
    if (event.key !== STORAGE_KEY || !event.newValue) return;
    try {
      const incoming = JSON.parse(event.newValue);
      const merged = mergeStates(state, incoming);
      if (stateFingerprint(merged) === stateFingerprint(state)) return;
      saveMergedState(merged);
      render();
      if (cloudCanPush) scheduleCloudPush();
    } catch (_) {
      // 다른 탭의 불완전한 값은 현재 화면에 반영하지 않습니다.
    }
  });

  function scheduleTodayRefresh() {
    const now = new Date();
    const next = new Date(now);
    next.setHours(24, 0, 2, 0);
    setTimeout(() => {
      const nextToday = C.toDateKey(new Date());
      if (nextToday !== todayKey) {
        todayKey = nextToday;
        render();
      }
      scheduleTodayRefresh();
    }, Math.max(1000, next - now));
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    const nextToday = C.toDateKey(new Date());
    if (nextToday !== todayKey) {
      todayKey = nextToday;
      render();
    }
    autoSyncCloud();
  });

  window.addEventListener("focus", () => autoSyncCloud());

  applyTheme(localStorage.getItem(THEME_KEY) || "light");
  persist({ sync: false });
  render();
  if (cloud.binId && cloud.key) {
    autoSyncCloud({ force: true });
  } else if (openedFromShareLink) {
    setTimeout(openCloudModal, 0);
  }
  scheduleTodayRefresh();
})();
</script>
</body>
</html>
