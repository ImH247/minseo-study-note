    </nav>`;
  }

  function renderCommonPanel() {
    return `
      <aside class="common-panel ${ui.commonCollapsed ? "collapsed" : ""}">
        <button class="mobile-common-toggle" data-action="toggle-common">
          <span>월간 달력 · D-Day</span><span>${ui.commonCollapsed ? "펼치기" : "접기"}</span>
        </button>
        <div class="common-inner">
          <p class="rail-label">Monthly index</p>
          ${renderMiniCalendar()}
          ${renderDdayPanel()}
        </div>
      </aside>`;
  }

  function renderMiniCalendar() {
    const monthDate = C.parseDateKey(ui.miniMonth);
    const year = monthDate.getFullYear();
    const month = monthDate.getMonth();
    const dates = C.monthGrid(year, month);
    return `
      <section class="mini-calendar" aria-label="작은 월간 달력">
        <div class="calendar-head">
          <button class="tiny-btn" data-action="mini-month-prev" aria-label="이전 달">‹</button>
          <button class="calendar-title" data-action="mini-month-today">${year}년 ${month + 1}월</button>
          <button class="tiny-btn" data-action="mini-month-next" aria-label="다음 달">›</button>
        </div>
        <div class="mini-weekdays">${WEEKDAYS.map((day) => `<span>${day}</span>`).join("")}</div>
        <div class="mini-days">
          ${dates.map((date) => {
            const key = C.toDateKey(date);
            const hasMark = state.ddays.some((item) => C.rangeContains(item.startDate, item.endDate, key))
              || state.tasks.some((task) => task.deadline === key);
            const classes = [
              "mini-day",
              date.getMonth() !== month ? "outside" : "",
              key === ui.selectedDate ? "selected" : "",
              key === todayKey ? "today" : "",
              hasMark ? "has-mark" : "",
            ].filter(Boolean).join(" ");
            return `<button class="${classes}" data-action="select-date" data-date="${key}" aria-label="${key}">${date.getDate()}</button>`;
          }).join("")}
        </div>
      </section>`;
  }

  function renderDdayPanel() {
    const list = state.ddays.slice().sort((a, b) => a.endDate.localeCompare(b.endDate));
    return `
      <section class="dday-panel">
        <div class="panel-head">
          <h2>D-Day</h2>
          <button class="tiny-btn" data-action="open-dday" aria-label="D-Day 추가">＋</button>
        </div>
        <div class="dday-list">
          ${list.length ? list.map((item) => `
            <article class="dday-ticket" style="border-left-color:${esc(item.color)}">
              <button class="ticket-main" data-action="edit-dday" data-id="${esc(item.id)}" aria-label="${esc(item.title)} 수정">
                <strong>${esc(item.title)}</strong>
                <span>${esc(C.ddayLabel(item, todayKey))}</span>
                <small>${esc(item.startDate === item.endDate ? item.endDate : `${item.startDate} ~ ${item.endDate}`)}</small>
              </button>
              <button class="ticket-delete" data-action="delete-dday" data-id="${esc(item.id)}" aria-label="${esc(item.title)} 삭제">×</button>
            </article>`).join("") : `<div class="empty-rail">수능일이나 접수 기간을 등록하면<br>남은 날짜가 자동 계산됩니다.</div>`}
        </div>
      </section>`;
  }

  function renderPage() {
    if (ui.page === "monthly") return renderMonthlyPage();
    if (ui.page === "study") return renderStudyPage();
    if (ui.page === "learning") return renderLearningPage();
    return renderWeeklyPage();
  }

  function renderPageHeader(eyebrow, title, subtitle, actions) {
    return `
      <div class="page-title-row">
        <div>
          <p class="eyebrow">${esc(eyebrow)}</p>
          <h1 class="page-title">${esc(title)}</h1>
          <p class="page-subtitle">${esc(subtitle)}</p>
        </div>
        ${actions ? `<div class="inline-actions">${actions}</div>` : ""}
      </div>`;
  }

  function renderWeeklyPage() {
    const start = C.startOfWeek(ui.selectedDate);
    const days = Array.from({ length: 7 }, (_, index) => C.addDays(start, index));
    const weekTasks = C.tasksForWeek(state, ui.selectedDate);
    const weekProgress = C.progressForTasks(weekTasks);
    const noteKey = C.weekKey(ui.selectedDate);
    const notes = state.weeklyNotes[noteKey] || { student: "" };
    const deadlines = weekTasks.slice().sort((a, b) => a.deadline.localeCompare(b.deadline)).slice(0, 8);
    return `
      ${renderPageHeader(
        "Weekly learning plan",
        "이번 주의 학습",
        "선생님과 정한 학습 범위를 매일 확인하고, 완료·진도·공부시간을 한 기록 안에서 관리합니다.",
        `<button class="primary-btn" data-action="open-task">＋ 학습 추가</button>`
      )}
      <div class="week-controls">
        <button class="icon-btn" data-action="week-prev" aria-label="이전 주">←</button>
        <button class="week-stamp" data-action="week-today">${weekRangeLabel(ui.selectedDate)}</button>
        <button class="icon-btn" data-action="week-next" aria-label="다음 주">→</button>
        <div class="week-progress">
          <span>주간 진도</span>
          <div class="progress-track"><div class="progress-fill" style="width:${weekProgress}%"></div></div>
          <strong>${weekProgress}%</strong>
        </div>
      </div>
      <section class="week-spread" aria-label="주간 학습 달력">
        ${days.slice(0, 5).map((date, index) => renderDayCard(date, index, false)).join("")}
        <div class="weekend-stack">
          ${days.slice(5).map((date, index) => renderDayCard(date, index + 5, true)).join("")}
        </div>
      </section>
      <section class="weekly-bottom">
        <div class="paper-card feedback-book">
          <div class="feedback-page">
            <h3>학생의 주간 메모</h3>
            <textarea class="lined-textarea" id="studentWeekNote" placeholder="어려웠던 부분, 다음 시간에 질문할 내용">${esc(notes.student)}</textarea>
            <div class="task-footer-actions"><button class="soft-btn" data-action="save-week-notes" data-note-field="student">메모 저장</button></div>
          </div>
          <div class="feedback-page">
            <h3>선생님의 학습 피드백</h3>
            <textarea class="lined-textarea" id="teacherWeekNote" placeholder="숙제 검사 결과, 보완할 개념, 다음 주 방향">${esc(notes.teacher)}</textarea>
            <div class="task-footer-actions"><button class="primary-btn" data-action="save-week-notes" data-note-field="teacher">피드백 저장</button></div>
          </div>
        </div>
        <div class="paper-card deadline-list">
          <h3>다가오는 마감</h3>
          ${deadlines.length ? deadlines.map((task) => {
            const subject = subjectById(task.subjectId);
            return `<button class="deadline-row" data-action="open-task-card" data-id="${esc(task.id)}" style="width:100%;border-inline:0;border-bottom:0;background:transparent;text-align:left;cursor:pointer">
              <span class="color-dot" style="--dot-color:${subject.color}"></span>
              <span>${esc(task.title)}<small style="display:block">${esc(subject.name)} · ${esc(categoryById(subject, task.categoryId)?.name || "")}</small></span>
              <small>${esc(formatShortDate(task.deadline))}</small>
            </button>`;
          }).join("") : `<div class="empty-rail">이 주에 예정된 학습이 없습니다.</div>`}
        </div>
      </section>`;
  }

  function renderDayCard(date, index, weekend) {
    const key = C.toDateKey(date);
    const tasks = C.tasksForDate(state, key);
    const visible = tasks.slice(0, weekend ? 3 : 5);
    return `
      <article class="day-card ${weekend ? "weekend" : ""} ${key === todayKey ? "today" : ""}">
        <header class="day-card-head">
          <span class="day-number">${date.getDate()}</span>
          <span class="day-name ${index === 6 ? "sun" : ""}">${WEEKDAYS_LONG[index]}</span>
        </header>
        <div class="day-task-list">
          ${visible.length ? visible.map((task) => renderTaskSlip(task)).join("") : `<div class="day-empty">여백도 계획의 일부예요</div>`}
          ${tasks.length > visible.length ? `<div class="more-count">+${tasks.length - visible.length}개 더 보기</div>` : ""}
        </div>
      </article>`;
  }

  function renderTaskSlip(task) {
    const subject = subjectById(task.subjectId);
    const category = categoryById(subject, task.categoryId);
    const progress = C.taskProgress(task);
    return `
      <button class="task-slip ${task.completed ? "checked" : ""}" style="--task-color:${subject.color};width:100%;text-align:left" data-action="open-task-card" data-id="${esc(task.id)}">
        <strong>${task.completed ? "✓ " : ""}${esc(task.title)}</strong>
        <span>${esc(subject.name)} · ${esc(category?.name || "기타")}${task.material ? ` · ${esc(task.material)}` : ""}</span>
        <span>마감 ${esc(formatShortDate(task.deadline))} · ${progress}%</span>
        <span class="mini-progress"><i style="width:${progress}%"></i></span>
      </button>`;
  }

  function renderMonthlyPage() {
    const monthDate = C.parseDateKey(ui.monthDate);
    const year = monthDate.getFullYear();
    const month = monthDate.getMonth();
    const gridDates = C.monthGrid(year, month);
    const ganttItems = [
      ...state.tasks.map((task) => {
        const subject = subjectById(task.subjectId);
        return {
          id: task.id,
          type: "task",
          title: `${subject.name} · ${task.title}`,
          startDate: task.startDate,
          endDate: task.deadline,
          color: subject.color,
          completed: task.completed,
        };
      }),
      ...state.ddays.map((item) => ({
        id: item.id,
        type: "dday",
        title: `D-Day · ${item.title}`,
        startDate: item.startDate,
        endDate: item.endDate,
        color: item.color,
        completed: false,
      })),
    ];
    const weekSegments = C.ganttSegments(ganttItems, gridDates, 4);
    return `
      ${renderPageHeader(
        "Monthly roadmap",
        `${year}년 ${month + 1}월`,
        "학습 시작일부터 마감일까지를 과목별 막대로 연결해 수능까지의 전체 흐름을 확인합니다.",
        `<button class="primary-btn" data-action="open-task">＋ 학습 추가</button>`
      )}
      <div class="week-controls">
        <button class="icon-btn" data-action="month-prev" aria-label="이전 달">←</button>
        <button class="week-stamp" data-action="month-today">${year}년 ${month + 1}월</button>
        <button class="icon-btn" data-action="month-next" aria-label="다음 달">→</button>
      </div>
      <section class="month-shell">
        <div class="month-board-inner">
          <div class="month-weekdays">${WEEKDAYS.map((day) => `<div>${day}</div>`).join("")}</div>
          ${Array.from({ length: 6 }, (_, weekIndex) => {
            const weekDates = gridDates.slice(weekIndex * 7, weekIndex * 7 + 7);
            const segmentData = weekSegments[weekIndex];
            return `<div class="month-week">
              <div class="month-days">
                ${weekDates.map((date) => {
                  const key = C.toDateKey(date);
                  return `<button class="month-day ${date.getMonth() !== month ? "outside" : ""} ${key === todayKey ? "today" : ""}" data-action="select-date" data-date="${key}" aria-label="${key}" style="border-top:0;border-bottom:0;text-align:left">
                    <strong>${date.getDate()}</strong>
                  </button>`;
                }).join("")}
              </div>
              <div class="gantt-layer">
                ${segmentData.segments.map((segment) => `
                  <div class="gantt-bar ${segment.type === "dday" ? "dday" : ""}" title="${esc(segment.title)} · ${segment.startDate} ~ ${segment.endDate}" style="grid-column:${segment.colStart}/${segment.colEnd};grid-row:${segment.lane + 1};--bar-color:${segment.color};opacity:${segment.completed ? ".48" : "1"}">
                    ${segment.continuesBefore ? "← " : ""}${esc(segment.title)}${segment.continuesAfter ? " →" : ""}
                  </div>`).join("")}
              </div>
              ${segmentData.hiddenCount ? `<span class="gantt-more">+${segmentData.hiddenCount}개</span>` : ""}
            </div>`;
          }).join("")}
        </div>
      </section>
      <div class="legend">
        ${state.subjects.map((subject) => `<span><i class="color-dot" style="--dot-color:${subject.color}"></i>${esc(subject.name)}</span>`).join("")}
        <span><i class="color-dot" style="--dot-color:${DDAY_COLORS[0]}"></i>D-Day 기간은 점선</span>
        <span>완료된 학습은 흐리게 표시</span>
      </div>`;
  }

  function renderStudyPage() {
    const start = C.startOfWeek(ui.studyWeek);
    const days = Array.from({ length: 7 }, (_, index) => C.addDays(start, index));
    const summary = C.weekStudySummary(state, ui.studyWeek);
    const dailyTotals = days.map((day) => {
      const key = C.toDateKey(day);
      const subjectMap = summary.byDate[key] || {};
      return Object.values(subjectMap).reduce((sum, minutes) => sum + minutes, 0);
    });
    const maxDaily = Math.max(1, ...dailyTotals);
    const activeDays = dailyTotals.filter((minutes) => minutes > 0).length;
    const bestIndex = dailyTotals.indexOf(Math.max(...dailyTotals));
    const logs = [];
    state.tasks.forEach((task) => {
      task.studyLogs.forEach((log) => {
        if (log.date >= summary.startDate && log.date <= summary.endDate) logs.push({ ...log, task });
      });
    });
    logs.sort((a, b) => b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt));
    return `
      ${renderPageHeader(
        "Study volume",
        "이번 주 공부량",
        "각 학습 항목에 입력한 시간을 날짜와 과목 기준으로 자동 합산합니다.",
        `<button class="primary-btn" data-action="navigate" data-page="learning">학습 페이지에서 시간 기록</button>`
      )}
      <div class="week-controls">
        <button class="icon-btn" data-action="study-week-prev" aria-label="이전 주">←</button>
        <button class="week-stamp" data-action="study-week-today">${weekRangeLabel(ui.studyWeek)}</button>
        <button class="icon-btn" data-action="study-week-next" aria-label="다음 주">→</button>
      </div>
      <section class="stats-grid">
        <article class="stat-card"><span>주간 총 공부시간</span><strong>${C.formatMinutes(summary.total)}</strong></article>
        <article class="stat-card"><span>일 평균</span><strong>${C.formatMinutes(Math.round(summary.total / 7))}</strong></article>
        <article class="stat-card"><span>공부한 날</span><strong>${activeDays}<small style="font-size:12px"> / 7일</small></strong></article>
        <article class="stat-card"><span>가장 집중한 날</span><strong>${summary.total ? WEEKDAYS_LONG[bestIndex] : "—"}</strong></article>
      </section>
      <section class="study-grid">
        <div class="paper-card chart-card">
          <h2 class="chart-title">날짜별 과목 공부시간</h2>
          <p class="chart-subtitle">막대의 색은 과목, 전체 높이는 하루 총 공부시간입니다.</p>
          <div class="bar-chart" role="img" aria-label="날짜별 과목 공부시간 막대그래프">
            ${days.map((day, index) => {
              const key = C.toDateKey(day);
              const map = summary.byDate[key] || {};
              const total = dailyTotals[index];
              const height = total ? Math.max(8, Math.round((total / maxDaily) * 190)) : 3;
              return `<div class="bar-column">
                <div class="bar-stack" style="height:${height}px" title="${key} · ${C.formatMinutes(total)}">
                  ${state.subjects.map((subject) => {
                    const minutes = map[subject.id] || 0;
                    if (!minutes || !total) return "";
                    return `<div class="bar-segment" style="height:${(minutes / total) * 100}%;--segment-color:${subject.color}" title="${esc(subject.name)} ${C.formatMinutes(minutes)}"></div>`;
                  }).join("")}
                </div>
                <div class="bar-label"><strong>${day.getDate()}</strong>${WEEKDAYS[index]}<br>${total ? esc(C.formatMinutes(total)) : "0분"}</div>
              </div>`;
            }).join("")}
          </div>
        </div>
        <div class="paper-card summary-card">
          <h2 class="chart-title">과목별 합계</h2>
          <p class="chart-subtitle">이번 주 전체 공부시간에서 차지하는 비중</p>
          <div class="subject-summary">
            ${state.subjects.map((subject) => {
              const minutes = summary.bySubject[subject.id] || 0;
              const ratio = summary.total ? Math.round((minutes / summary.total) * 100) : 0;
              return `<div class="subject-summary-row" style="--subject-color:${subject.color}">
                <strong>${esc(subject.name)}</strong>
                <div class="progress-track"><div class="progress-fill" style="width:${ratio}%"></div></div>
                <span>${esc(C.formatMinutes(minutes))}</span>
              </div>`;
            }).join("")}
          </div>
          <div class="recent-logs">
            <h3 style="margin:4px 0 0;font-family:var(--serif);font-size:15px">최근 기록</h3>
            ${logs.slice(0, 8).map(({ task, ...log }) => {
              const subject = subjectById(task.subjectId);
              return `<div class="log-row">
                <span class="color-dot" style="--dot-color:${subject.color}"></span>
                <span>${esc(log.date)} · ${esc(task.title)}</span>
                <strong>${esc(C.formatMinutes(log.minutes))}</strong>
                <button data-action="delete-log" data-task-id="${esc(task.id)}" data-log-id="${esc(log.id)}" aria-label="공부시간 기록 삭제">×</button>
              </div>`;
            }).join("") || `<div class="empty-rail">학습 항목에서 공부시간을 기록해 보세요.</div>`}
          </div>
        </div>
      </section>`;
  }

  function renderLearningPage() {
    if (!state.subjects.some((subject) => subject.id === ui.selectedSubject)) {
      ui.selectedSubject = state.subjects[0].id;
    }
    const selected = subjectById(ui.selectedSubject);
    const subjectTasks = state.tasks.filter((task) => task.subjectId === selected.id);
    const filtered = subjectTasks.filter((task) => {
      if (ui.selectedCategory !== "all" && task.categoryId !== ui.selectedCategory) return false;
      if (ui.learningFilter === "active" && task.completed) return false;
      if (ui.learningFilter === "done" && !task.completed) return false;
      return true;
    }).sort((a, b) => Number(a.completed) - Number(b.completed) || a.deadline.localeCompare(b.deadline));
    return `
      ${renderPageHeader(
        "Learning library",
        "과목별 학습",
        "학습 범위와 마감, 페이지 진도, 공부시간, 숙제 검사와 피드백을 한 항목에 이어서 기록합니다.",
        `<button class="primary-btn" data-action="open-task">＋ 학습 항목</button>`
      )}
      <section class="paper-card learning-overview">
        <div>
          <p class="eyebrow">Overall progress</p>
          <div class="overall-number">${C.overallProgress(state)}<small>%</small></div>
          <p class="page-subtitle">전체 페이지 수를 기준으로 가중 계산한 진도입니다.</p>
        </div>
        <div class="subject-tabs">
          ${state.subjects.map((subject) => {
            const progress = C.subjectProgress(state, subject.id);
            const count = state.tasks.filter((task) => task.subjectId === subject.id && !task.completed).length;
            return `<button class="subject-tab ${ui.selectedSubject === subject.id ? "active" : ""}" style="--subject-color:${subject.color}" data-action="select-subject" data-id="${subject.id}">
              <strong>${esc(subject.name)}</strong>
              <span>${progress}% · 남은 학습 ${count}개</span>
            </button>`;
          }).join("")}
        </div>
      </section>

  function navigate(page) {
    ui.page = page;

  function moveMonth(dateKey, amount) {
    const date = C.parseDateKey(dateKey);
    date.setMonth(date.getMonth() + amount, 1);
    return C.toDateKey(date);
  }

  function findTask(id) {
    return state.tasks.find((task) => task.id === id);
  }

  function updateTask(task, changes, explicitGroups) {
    const timestamp = nowIso();
    const groups = new Set(Array.isArray(explicitGroups) ? explicitGroups : explicitGroups ? [explicitGroups] : []);
    const keys = Object.keys(changes || {});
    if (keys.some((key) => ["subjectId", "categoryId", "title", "material", "startDate", "deadline", "totalPages"].includes(key))) groups.add("plan");
    if (keys.includes("completed")) groups.add("completion");
    if (keys.includes("completedPages")) groups.add("pages");
    if (keys.includes("teacherChecked")) groups.add("review");
    if (keys.includes("feedback")) groups.add("feedback");
    if (keys.includes("studentNote")) groups.add("studentNote");
    Object.assign(task, changes, { updatedAt: timestamp });
    groups.forEach((group) => {
      const stampKey = {
        plan: "planUpdatedAt",
        completion: "completionUpdatedAt",
        pages: "pagesUpdatedAt",
        review: "reviewUpdatedAt",
        feedback: "feedbackUpdatedAt",
        studentNote: "studentNoteUpdatedAt",
      }[group];
      if (stampKey) task[stampKey] = timestamp;
    });
    persist();
    render();
  }

  function removeTask(id) {
    const task = findTask(id);
    if (!task) return;
    const studyTime = task.studyLogs.reduce((sum, log) => sum + log.minutes, 0);
    const warning = studyTime
      ? `이 학습과 연결된 ${C.formatMinutes(studyTime)}의 공부시간 및 피드백도 함께 삭제됩니다. 계속할까요?`
      : "이 학습 항목과 피드백을 삭제할까요?";
    if (!confirm(warning)) return;
    state.tasks = state.tasks.filter((item) => item.id !== id);
    state.tombstones.tasks[id] = nowIso();
    if (ui.expandedTaskId === id) ui.expandedTaskId = "";
    persist();
    render();
  }

        </div>
      </form>`, { wide: false });

    subjectSelect.addEventListener("change", () => {
      const next = subjectById(subjectSelect.value);
      document.getElementById("taskCategory").innerHTML = renderCategoryOptions(next, next.categories[0]?.id || "");
    });
    document.getElementById("taskForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const title = document.getElementById("taskTitle").value.trim();
      const nextSubject = subjectById(document.getElementById("taskSubject").value);
      const nextCategory = document.getElementById("taskCategory").value;
      const startDate = document.getElementById("taskStart").value;
      const deadline = document.getElementById("taskDeadline").value;
      const totalPages = Math.max(0, Math.round(Number(document.getElementById("taskTotalPages").value) || 0));
      const completedPages = Math.max(0, Math.round(Number(document.getElementById("taskCompletedPages").value) || 0));
      if (!title || !startDate || !deadline) return showToast("필수 항목을 입력해 주세요.");
      if (deadline < startDate) return showToast("데드라인은 학습 시작일보다 빠를 수 없습니다.");
      if (completedPages > totalPages && totalPages > 0) return showToast("완료 페이지는 전체 페이지를 넘을 수 없습니다.");
      const timestamp = nowIso();
      if (existing) {
        const nextCompleted = totalPages > 0 && completedPages >= totalPages ? true : existing.completed;
        Object.assign(existing, {
          title,
          subjectId: nextSubject.id,
          categoryId: nextCategory,
          material: document.getElementById("taskMaterial").value.trim(),
          startDate,
          deadline,
          totalPages,
          completedPages,
          completed: nextCompleted,
          planUpdatedAt: timestamp,
          pagesUpdatedAt: timestamp,
          completionUpdatedAt: nextCompleted !== existing.completed ? timestamp : existing.completionUpdatedAt,
          updatedAt: timestamp,
        });
      } else {
        state.tasks.push({
          id: C.newId("task"),
          subjectId: nextSubject.id,
          categoryId: nextCategory,
          title,
          material: document.getElementById("taskMaterial").value.trim(),
          startDate,
          deadline,
          totalPages,
          completedPages,
          completed: totalPages > 0 && completedPages >= totalPages,
          teacherChecked: false,
          feedback: "",
          studentNote: "",
          studyLogs: [],
          studyLogTombstones: {},
          planUpdatedAt: timestamp,
          completionUpdatedAt: timestamp,
          pagesUpdatedAt: timestamp,
          reviewUpdatedAt: timestamp,
          feedbackUpdatedAt: timestamp,
          studentNoteUpdatedAt: timestamp,
          createdAt: timestamp,
          updatedAt: timestamp,
        });
      }
      persist();
      closeModal();
      ui.page = "learning";
      ui.selectedSubject = nextSubject.id;
      ui.selectedCategory = "all";
      ui.learningFilter = "all";
      render();
      showToast(existing ? "학습 정보를 수정했습니다." : "새 학습을 추가했습니다.");
    });
  }

        </div>` : ""}
        <div class="cloud-row">
          <span><strong>데이터 크기</strong><small style="display:block;color:var(--muted);margin-top:3px">${sizeKb}KB · 장기 사용 시 정기 백업 권장</small></span>
          <div class="inline-actions">
            <button class="soft-btn" data-action="export-backup">JSON 백업</button>
            <button class="soft-btn" data-action="import-backup">JSON 병합</button>
            <input id="backupInput" type="file" accept=".json,application/json" hidden>
            ${cloud.binId && cloud.key ? `<button class="soft-btn" data-action="sync-now">지금 동기화</button><button class="danger-btn" data-action="disconnect-cloud">연결 해제</button>` : ""}
          </div>
        </div>
        ${sizeKb >= 85 ? `<div class="cloud-help" style="color:var(--brick)">현재 데이터가 ${sizeKb}KB입니다. JSONBin 무료 일반 Bin의 100KB 제한에 가까우므로 JSON 백업을 내려받고 용량을 확인해 주세요.</div>` : ""}
      </div>
      <div class="modal-actions"><button class="soft-btn" data-action="close-modal">닫기</button></div>`, { wide: true });
  }

  function applyTheme(theme) {
    document.documentElement.classList.toggle("dark", theme === "dark");
    localStorage.setItem(THEME_KEY, theme);
  }

  function cloudHeaders(contentType) {
    const headers = {};
    headers[cloud.keyType === "master" ? "X-Master-Key" : "X-Access-Key"] = cloud.key;
    if (contentType) headers["Content-Type"] = "application/json";
    return headers;
  }

  function remoteStateFromRecord(record) {
    if (!record || typeof record !== "object") return null;
    const value = record.studyCoachState;
    if (value == null) return null;
    if (typeof value === "string") {
      try {
        const parsed = JSON.parse(value);
        if (!parsed || !Array.isArray(parsed.subjects) || !Array.isArray(parsed.tasks)) throw new Error("invalid");
        return C.normalizeState(parsed);
      } catch (_) {
        throw new Error("클라우드 데이터 형식 오류");
      }
    }
    if (!value || typeof value !== "object" || !Array.isArray(value.subjects) || !Array.isArray(value.tasks)) {
      throw new Error("클라우드 데이터 형식 오류");
    }
    return C.normalizeState(value);
  }

  function stateFingerprint(value) {
    const copy = JSON.parse(JSON.stringify(C.normalizeState(value)));
    copy.tasks.sort((a, b) => a.id.localeCompare(b.id));
    copy.tasks.forEach((task) => task.studyLogs.sort((a, b) => a.id.localeCompare(b.id)));
    copy.ddays.sort((a, b) => a.id.localeCompare(b.id));
    copy.subjects.forEach((subject) => subject.categories.sort((a, b) => a.id.localeCompare(b.id)));
    return JSON.stringify(copy);
  }

  async function fetchRemoteRecord() {
    const response = await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(cloud.binId)}/latest`, { headers: cloudHeaders(false) });
    if (!response.ok) throw new Error(`${response.status}`);
    const json = await response.json();
    return json.record || {};
  }

  async function pullCloud(options) {
    const settings = options || {};
    if (!cloud.binId || !cloud.key) return false;
    cloud.status = "불러오는 중";
    renderTopOnly();
    try {
      const record = await fetchRemoteRecord();
      const remoteState = remoteStateFromRecord(record);
      const merged = remoteState ? C.mergeStates(state, remoteState) : C.normalizeState(state);
      saveMergedState(merged);
      cloudCanPush = true;
      cloud.pending = false;
      cloud.status = "동기화 완료";
      cloud.lastSync = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
      saveCloudConfig();
      render();
      if (!settings.silent) showToast("클라우드 데이터를 불러왔습니다.");
      return true;
    } catch (error) {
      cloudCanPush = false;
      cloud.status = `불러오기 실패 (${error.message})`;
      saveCloudConfig();
      renderTopOnly();
      if (!settings.silent) showToast("클라우드 연결을 확인해 주세요.");
      return false;
    }
  }

  function scheduleCloudPush() {
    clearTimeout(cloudPushTimer);
    cloudPushTimer = setTimeout(pushCloud, 1400);
  }

  async function pushCloud() {
    if (!cloudCanPush || !cloud.binId || !cloud.key || cloudPushRunning) return false;
    cloudPushRunning = true;
    cloud.status = "저장 중";
    renderTopOnly();
    try {
      const remoteRecord = await fetchRemoteRecord();
      const remoteState = remoteStateFromRecord(remoteRecord);
      let merged = remoteState ? C.mergeStates(state, remoteState) : C.normalizeState(state);
      let payload = { ...remoteRecord, studyCoachState: merged };
      let response = await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(cloud.binId)}`, {
        method: "PUT",
        headers: { ...cloudHeaders(true), "X-Bin-Versioning": "true" },
        body: JSON.stringify(payload),
      });
      if (!response.ok) throw new Error(`${response.status}`);
      cloud.status = "저장 확인 중";
      renderTopOnly();
      let verifiedRecord = await fetchRemoteRecord();
      let verifiedState = remoteStateFromRecord(verifiedRecord);
      if (!verifiedState) throw new Error("저장 확인 실패");
      let union = C.mergeStates(merged, verifiedState);
      if (stateFingerprint(union) !== stateFingerprint(verifiedState)) {
        payload = { ...verifiedRecord, studyCoachState: union };
        response = await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(cloud.binId)}`, {
          method: "PUT",
          headers: { ...cloudHeaders(true), "X-Bin-Versioning": "true" },
          body: JSON.stringify(payload),
        });
        if (!response.ok) throw new Error(`${response.status}`);
        verifiedRecord = await fetchRemoteRecord();
        verifiedState = remoteStateFromRecord(verifiedRecord);
        if (!verifiedState) throw new Error("저장 재확인 실패");
        union = C.mergeStates(union, verifiedState);
        if (stateFingerprint(union) !== stateFingerprint(verifiedState)) {
          throw new Error("동시 수정 감지 · 다시 동기화");
        }
      }
      merged = union;
      saveMergedState(merged);
      cloud.pending = false;
      cloud.status = "동기화 완료";
      cloud.lastSync = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
      saveCloudConfig();
      render();
      return true;
    } catch (error) {
      cloudCanPush = false;
      cloud.pending = true;
      cloud.status = `저장 실패 (${error.message})`;
      saveCloudConfig();
      renderTopOnly();
      showToast("로컬에는 저장했습니다. 연결 후 ‘지금 동기화’를 눌러 주세요.");
      return false;
    } finally {
      cloudPushRunning = false;
    }
  }

  async function connectCloud(createNew) {
    const keyType = document.getElementById("cloudKeyType")?.value || "access";
    const key = document.getElementById("cloudKeyInput")?.value.trim() || "";
    const binId = document.getElementById("cloudBinInput")?.value.trim() || "";
    if (!key) return showToast("JSONBin Key를 입력해 주세요.");
    cloud.keyType = keyType;
    cloud.key = key;
    cloud.binId = binId;
    if (createNew) {
      cloud.status = "새 Bin 생성 중";
      renderTopOnly();
      try {
        const response = await fetch("https://api.jsonbin.io/v3/b", {
          method: "POST",
          headers: { ...cloudHeaders(true), "X-Bin-Name": "suneung-weekbook", "X-Bin-Private": "true" },
          body: JSON.stringify({ studyCoachState: state }),
        });
        if (!response.ok) throw new Error(`${response.status}`);
        const json = await response.json();
        cloud.binId = json.metadata && json.metadata.id ? json.metadata.id : "";
        if (!cloud.binId) throw new Error("Bin ID 없음");
        cloudCanPush = true;
        cloud.status = "동기화 완료";
        cloud.lastSync = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
        saveCloudConfig();
        openCloudModal();
        showToast("새 클라우드 저장소를 만들었습니다.");
      } catch (error) {
        cloudCanPush = false;
        cloud.status = `생성 실패 (${error.message})`;
        saveCloudConfig();
        openCloudModal();
        showToast("키의 Bin 생성 권한을 확인해 주세요.");
      }
      return;
    }
    if (!binId) return showToast("Bin ID를 입력해 주세요.");
    saveCloudConfig();
    const ok = await pullCloud({ silent: false });
    openCloudModal();
    if (ok) await pushCloud();
  }

  function makeShareUrl() {
    const url = new URL(location.href);
    url.hash = `bin=${encodeURIComponent(cloud.binId)}`;
    return url.toString();
  }

  function exportBackup() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    link.href = url;
    link.download = `suneung-weekbook-${todayKey}.json`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 500);
    showToast("JSON 백업 파일을 저장했습니다.");
  }

  async function importBackup(file) {
    if (!file) return;
    try {
      const parsed = JSON.parse(await file.text());
      if (!parsed || !Array.isArray(parsed.subjects) || !Array.isArray(parsed.tasks)) throw new Error("invalid");
      if (!confirm("백업 데이터를 현재 기록과 안전하게 병합할까요? 현재 기록은 유지됩니다.")) return;
      saveMergedState(C.mergeStates(state, parsed));
      persist();
      closeModal();
      render();
      showToast("백업 데이터를 병합했습니다.");
    } catch (_) {
      showToast("읽을 수 있는 민서의 학습 노트 JSON 파일이 아닙니다.");
    }
  }

  async function syncNow() {
    const pulled = await pullCloud({ silent: true });
    if (!pulled) return showToast("클라우드에서 불러오지 못했습니다.");
    cloudCanPush = true;
    const pushed = await pushCloud();
    openCloudModal();
    if (pushed) showToast("최신 데이터로 동기화했습니다.");
  }

  document.addEventListener("click", async function (event) {
    const target = event.target.closest("[data-action]");
    if (!target) return;
    const action = target.dataset.action;
    if (action === "close-modal") {
      if (target.matches("[data-modal-panel]")) return;
      if (target.classList.contains("modal-backdrop") && event.target.closest("[data-modal-panel]")) return;
      return closeModal();
    }
    if (action === "navigate") return navigate(target.dataset.page);
    if (action === "toggle-theme") {
      applyTheme(document.documentElement.classList.contains("dark") ? "light" : "dark");
      return render();
    }
    if (action === "open-cloud") return openCloudModal();
    if (action === "toggle-common") {
      ui.commonCollapsed = !ui.commonCollapsed;
      return render();
    }
    if (action === "mini-month-prev") {
      ui.miniMonth = moveMonth(ui.miniMonth, -1);
      return render();
    }
    if (action === "mini-month-next") {
      ui.miniMonth = moveMonth(ui.miniMonth, 1);
      return render();
    }
    if (action === "mini-month-today") {
      ui.miniMonth = `${todayKey.slice(0, 7)}-01`;
      return render();
    }
    if (action === "select-date") {
      ui.selectedDate = target.dataset.date;
      ui.studyWeek = C.weekKey(ui.selectedDate);
      ui.miniMonth = `${ui.selectedDate.slice(0, 7)}-01`;
      ui.page = "weekly";
      return render();
    }
    if (action === "open-dday") return openDdayModal("");
    if (action === "edit-dday") return openDdayModal(target.dataset.id);
    if (action === "delete-dday") {
      if (!confirm("이 D-Day를 삭제할까요?")) return;
      state.ddays = state.ddays.filter((item) => item.id !== target.dataset.id);
      state.tombstones.ddays[target.dataset.id] = nowIso();
      persist();
      return render();
    }
    if (action === "week-prev") {
      ui.selectedDate = C.toDateKey(C.addDays(ui.selectedDate, -7));
      return render();
    }
    if (action === "week-next") {
      ui.selectedDate = C.toDateKey(C.addDays(ui.selectedDate, 7));
      return render();
    }
    if (action === "week-today") {
      ui.selectedDate = todayKey;
      return render();
    }
    if (action === "save-week-notes") {
      const key = C.weekKey(ui.selectedDate);
      const existing = state.weeklyNotes[key] || {
        student: "",
        teacher: "",
        studentUpdatedAt: "",
        teacherUpdatedAt: "",
        updatedAt: "",
      };
      const timestamp = nowIso();
      existing[field] = document.getElementById(field === "teacher" ? "teacherWeekNote" : "studentWeekNote")?.value || "";
      existing[`${field}UpdatedAt`] = timestamp;
      existing.updatedAt = timestamp;
      state.weeklyNotes[key] = existing;
      persist();
      render();
      return showToast(field === "teacher" ? "선생님 피드백을 저장했습니다." : "학생 메모를 저장했습니다.");
    }
    if (action === "open-task") return openTaskModal("");
    if (action === "open-task-card") {
      ui.page = "learning";
      const task = findTask(target.dataset.id);
      if (task) ui.selectedSubject = task.subjectId;
      ui.selectedCategory = "all";
      ui.learningFilter = "all";
      ui.expandedTaskId = target.dataset.id;
      return render();
    }
    if (action === "month-prev") {
      ui.monthDate = moveMonth(ui.monthDate, -1);
      return render();
    }
    if (action === "month-next") {
      ui.monthDate = moveMonth(ui.monthDate, 1);
      return render();
    }
    if (action === "month-today") {
      ui.monthDate = `${todayKey.slice(0, 7)}-01`;
      return render();
    }
    if (action === "study-week-prev") {
      ui.studyWeek = C.toDateKey(C.addDays(ui.studyWeek, -7));
      return render();
    }
    if (action === "study-week-next") {
      ui.studyWeek = C.toDateKey(C.addDays(ui.studyWeek, 7));
      return render();
    }
    if (action === "study-week-today") {
      ui.studyWeek = C.weekKey(todayKey);
      return render();
    }
    if (action === "select-subject") {
      ui.selectedSubject = target.dataset.id;
      ui.selectedCategory = "all";
      ui.expandedTaskId = "";
      return render();
    }
    if (action === "select-category") {
      ui.selectedCategory = target.dataset.id;
      return render();
    }
    if (action === "set-filter") {
      ui.learningFilter = target.dataset.id;
      return render();
    }
    if (action === "open-categories") return openCategoryModal();
    if (action === "rename-category") {
      const subject = subjectById(ui.selectedSubject);
      const category = subject.categories.find((item) => item.id === target.dataset.id);
      if (!category) return;
      const nextName = prompt("새 하위 항목 이름", category.name);
      if (nextName == null) return;
      const name = nextName.trim();
      if (!name) return showToast("이름을 입력해 주세요.");
      if (subject.categories.some((item) => item.id !== category.id && item.name.toLowerCase() === name.toLowerCase())) {
        return showToast("같은 이름의 하위 항목이 있습니다.");
      }
      category.name = name;
      category.updatedAt = nowIso();
      persist();
      openCategoryModal();
      return showToast("하위 항목 이름을 변경했습니다.");
    }
    if (action === "delete-category") {
      const subject = subjectById(ui.selectedSubject);
      const category = subject.categories.find((item) => item.id === target.dataset.id);
      if (!category || state.tasks.some((task) => task.categoryId === category.id)) return;
      if (!confirm(`'${category.name}' 하위 항목을 삭제할까요?`)) return;
      subject.categories = subject.categories.filter((item) => item.id !== category.id);
      state.tombstones.categories[category.id] = nowIso();
      if (ui.selectedCategory === category.id) ui.selectedCategory = "all";
      persist();
      openCategoryModal();
      return;
    }
    if (action === "toggle-task-card") {
      ui.expandedTaskId = ui.expandedTaskId === target.dataset.id ? "" : target.dataset.id;
      return render();
    }
    if (action === "toggle-complete") {
      const task = findTask(target.dataset.id);
      if (!task) return;
      const completed = !task.completed;
      return updateTask(task, {
        completed,
        completedPages: completed && task.totalPages > 0 ? task.totalPages : task.completedPages,
      });
    }
    if (action === "save-pages") {
      const task = findTask(target.dataset.id);
      const input = document.getElementById(`pages_${target.dataset.id}`);
      if (!task || !input) return;
      const pages = Math.max(0, Math.round(Number(input.value) || 0));
      if (task.totalPages > 0 && pages > task.totalPages) return showToast("완료 페이지는 전체 페이지를 넘을 수 없습니다.");
      return updateTask(task, { completedPages: pages, completed: task.totalPages > 0 ? pages >= task.totalPages : task.completed });
    }
    if (action === "add-log") {
      const task = findTask(target.dataset.id);
      if (!task) return;
      const date = document.getElementById(`logdate_${task.id}`)?.value;
      const hours = Math.max(0, Math.round(Number(document.getElementById(`loghour_${task.id}`)?.value) || 0));
      const minutesPart = Math.max(0, Math.round(Number(document.getElementById(`logmin_${task.id}`)?.value) || 0));
      if (!date) return showToast("공부 날짜를 선택해 주세요.");
      if (hours > 23 || minutesPart > 59) return showToast("시간은 0~23, 분은 0~59로 입력해 주세요.");
      const minutes = hours * 60 + minutesPart;
      if (!minutes) return showToast("0분은 기록할 수 없습니다.");
      const existingDayTotal = state.tasks.reduce((sum, item) => sum + item.studyLogs.filter((log) => log.date === date).reduce((subtotal, log) => subtotal + log.minutes, 0), 0);
      if (existingDayTotal + minutes > 1440 && !confirm("이 날짜의 총 공부시간이 24시간을 넘습니다. 그래도 기록할까요?")) return;
      const timestamp = nowIso();
      task.studyLogs.push({ id: C.newId("log"), date, minutes, createdAt: timestamp, updatedAt: timestamp });
      return updateTask(task, {}, "logs");
    }
    if (action === "delete-log") {
      const task = findTask(target.dataset.taskId);
      if (!task || !confirm("이 공부시간 기록을 삭제할까요?")) return;
      task.studyLogTombstones = task.studyLogTombstones || {};
      task.studyLogTombstones[target.dataset.logId] = nowIso();
      task.studyLogs = task.studyLogs.filter((log) => log.id !== target.dataset.logId);
      return updateTask(task, {}, "logs");
    }
    if (action === "teacher-check") {
      const task = findTask(target.dataset.id);
      if (!task) return;
      return updateTask(task, { teacherChecked: target.checked });
    }
    if (action === "save-student-note") {
      const task = findTask(target.dataset.id);
      const input = document.getElementById(`studentnote_${target.dataset.id}`);
      if (!task || !input) return;
      updateTask(task, { studentNote: input.value });
      return showToast("학생 메모를 저장했습니다.");
    }
    if (action === "save-feedback") {
      const task = findTask(target.dataset.id);
      const input = document.getElementById(`feedback_${target.dataset.id}`);
      if (!task || !input) return;
      updateTask(task, { feedback: input.value });
      return showToast("선생님 피드백을 저장했습니다.");
    }
    if (action === "edit-task") return openTaskModal(target.dataset.id);
    if (action === "delete-task") return removeTask(target.dataset.id);
    if (action === "connect-cloud") return connectCloud(false);
    if (action === "create-cloud") return connectCloud(true);
    if (action === "copy-share") {
      const value = document.getElementById("shareUrl")?.value || makeShareUrl();
      try {
        await navigator.clipboard.writeText(value);
        showToast("공유 주소를 복사했습니다.");
      } catch (_) {
        showToast("주소를 선택해 직접 복사해 주세요.");
      }
      return;
    }
    if (action === "sync-now") return syncNow();
    if (action === "disconnect-cloud") {
      if (!confirm("이 기기에서 클라우드 연결을 해제할까요? 로컬 데이터는 유지됩니다.")) return;
      cloud = { binId: "", key: "", keyType: "access", status: "로컬 저장", lastSync: "", pending: false };
      cloudCanPush = false;
      saveCloudConfig();
      closeModal();
      render();
      return showToast("클라우드 연결을 해제했습니다.");
    }
    if (action === "export-backup") return exportBackup();
    if (action === "import-backup") {
      document.getElementById("backupInput")?.click();
      return;
    }
  });

  document.addEventListener("change", (event) => {
    if (event.target && event.target.id === "backupInput") importBackup(event.target.files?.[0]);
  });

  window.addEventListener("storage", (event) => {
    if (event.key !== STORAGE_KEY || !event.newValue) return;
    try {
      const incoming = JSON.parse(event.newValue);
      const merged = C.mergeStates(state, incoming);
      if (stateFingerprint(merged) === stateFingerprint(state)) return;
      saveMergedState(merged);
      render();
      if (cloudCanPush) scheduleCloudPush();
    } catch (_) {
      // 다른 탭의 불완전한 값은 현재 화면에 반영하지 않습니다.
    }
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    const nextToday = C.toDateKey(new Date());
    if (nextToday !== todayKey) {
      todayKey = nextToday;
      render();
    }
    if (cloud.binId && cloud.key && cloud.pending) {
      pullCloud({ silent: true }).then((ok) => {
        if (ok) pushCloud();
      });
    }
  });
})();

</script>
<script id="study-coach-v3">
(function () {
  "use strict";

  const C = window.StudyCore;
  const LEGACY_STORAGE_KEY = "study_coach_state_v1";
  const STORAGE_PREFIX = "study_coach_state_v3_bin_";
  let STORAGE_KEY = LEGACY_STORAGE_KEY;
  const CLOUD_KEY = "study_coach_cloud_v1";
  const THEME_KEY = "study_coach_theme";

      planId: String((log && log.planId) || ""),
      date: C.toDateKey(log && log.date) || todayKey,
      minutes: Math.max(0, Math.round(Number(log && log.minutes) || 0)),
      createdAt: String((log && log.createdAt) || stamp),
      updatedAt: stamp,
    };
  }

  function normalizeMaterial(raw, subjects) {
    const source = raw || {};
    const subject = subjects.find((item) => item.id === source.subjectId) || subjects[0];
    const category = subject.categories.find((item) => item.id === source.categoryId) || subject.categories[0];
    const range = C.normalizedRange(source.startDate || source.deadline, source.deadline || source.startDate);
    const stamp = String(source.updatedAt || source.createdAt || nowIso());
    const totalPages = Math.max(1, Math.round(Number(source.totalPages) || 1));
    const completedPages = C.clamp(Math.round(Number(source.completedPages) || 0), 0, totalPages);
    const title = String(source.bookName || source.material || source.title || "교재").trim();
    return {
      id: String(source.id || C.newId("material")),
      subjectId: subject.id,
      categoryId: category ? category.id : "",
      title,
      legacyAssignment: source.material ? String(source.title || "") : String(source.legacyAssignment || ""),
      deadline: range.end || todayKey,
      totalPages,
      completedPages,
      completed: Boolean(source.completed || completedPages >= totalPages),
      studyLogs: Array.isArray(source.studyLogs)
        ? source.studyLogs.map(normalizeLog).filter((log) => log.minutes > 0)
        : [],
      studyLogTombstones: { ...(source.studyLogTombstones || {}) },
      createdAt: String(source.createdAt || stamp),
      updatedAt: stamp,
    };
  }

  function normalizePlan(raw, materials) {
    const source = raw || {};
    const material = materials.find((item) => item.id === source.taskId);
    if (!material) return null;
    const startPage = C.clamp(Math.round(Number(source.startPage) || 1), 1, material.totalPages);
    const endPage = C.clamp(Math.round(Number(source.endPage) || startPage), startPage, material.totalPages);
    const stamp = String(source.updatedAt || source.createdAt || nowIso());
    return {
      id: String(source.id || C.newId("plan")),
      date: C.toDateKey(source.date) || todayKey,
      subjectId: material.subjectId,
      taskId: material.id,
      startPage,
      endPage,
      label: String(source.label || ""),
      note: String(source.note || ""),
      completed: Boolean(source.completed),
      createdAt: String(source.createdAt || stamp),
      updatedAt: stamp,
    };
  }

  function normalizeScore(raw, subjects) {
    const source = raw || {};
    const subject = subjects.find((item) => item.id === source.subjectId) || subjects[0];
    const stamp = String(source.updatedAt || source.createdAt || nowIso());
    return {
      id: String(source.id || C.newId("score")),
      date: C.toDateKey(source.date) || todayKey,
      examName: String(source.examName || "모의고사").trim(),
      subjectId: subject.id,
      score: C.clamp(Math.round(Number(source.score) || 0), 0, 100),
      grade: C.clamp(Math.round(Number(source.grade) || 9), 1, 9),
      createdAt: String(source.createdAt || stamp),
      updatedAt: stamp,
    };
  }

  function normalizeExamInfo(raw) {
    const fallback = defaultExamInfo();
    if (!raw || typeof raw !== "object") return fallback;
    const subjects = {};
    SUBJECT_SEED.forEach((seed) => {
      const source = raw.subjects && raw.subjects[seed.id];
      const base = fallback.subjects[seed.id];
      subjects[seed.id] = {
        title: String((source && source.title) || base.title),
        bands: Array.isArray(source && source.bands) && source.bands.length
          ? source.bands.map((band) => ({
              range: String((band && band.range) || ""),
              text: String((band && band.text) || ""),
            })).filter((band) => band.range || band.text)
          : base.bands,
      };
    });
    const schedule = Array.isArray(raw.schedule) && raw.schedule.length
      ? raw.schedule.map((row) => ({
          period: String((row && row.period) || ""),
          subject: String((row && row.subject) || ""),
          time: String((row && row.time) || ""),
          note: String((row && row.note) || ""),
        })).filter((row) => row.period || row.subject || row.time || row.note)
      : fallback.schedule;
    const sources = Array.isArray(raw.sources) && raw.sources.length
      ? raw.sources.map((source) => ({
          label: String((source && source.label) || ""),
          url: String((source && source.url) || ""),
        })).filter((source) => source.label && /^https?:\/\//i.test(source.url))
      : fallback.sources;
    return {
      title: String(raw.title || fallback.title),
      subtitle: String(raw.subtitle || fallback.subtitle),
      notice: String(raw.notice || fallback.notice),
      schedule,
      subjects,
      sources,
      updatedAt: String(raw.updatedAt || fallback.updatedAt),
    };
  }

  function normalizeState(raw) {
    const fallback = defaultState();
    if (!raw || typeof raw !== "object") return fallback;

    const subjects = Array.isArray(raw.subjects) && raw.subjects.length
      ? SUBJECT_SEED.map((seed, index) => {
          const source = raw.subjects.find((item) => item && item.id === seed.id) || raw.subjects[index] || {};
          const fallbackSubject = makeSubjects()[index];
          return {
            id: seed.id,
            name: seed.name,
            color: seed.color,
            categories: Array.isArray(source.categories) && source.categories.length
              ? source.categories.map((category) => ({
                  id: String((category && category.id) || C.newId("cat")),
                  name: String((category && category.name) || category || "기타"),
                  updatedAt: String((category && category.updatedAt) || "2000-01-01T00:00:00.000Z"),
                }))
              : fallbackSubject.categories,
          };
        })
      : fallback.subjects;

    const rawTasks = Array.isArray(raw.tasks)
      ? raw.tasks
      : Array.isArray(raw.materials)
        ? raw.materials
        : [];
    const tasks = rawTasks
      .map((task) => normalizeMaterial(task, subjects))
      .filter((task) => task.title);

    let plans = Array.isArray(raw.plans)
      ? raw.plans.map((plan) => normalizePlan(plan, tasks)).filter(Boolean)
      : [];

    if (!Array.isArray(raw.plans) && Number(raw.version || 2) < 3) {
      plans = rawTasks.map((legacy, index) => {
        const material = tasks[index];
        if (!material) return null;
        const targetEnd = material.totalPages;
        return normalizePlan({
          id: `plan_legacy_${material.id}`,
          date: legacy.deadline || legacy.startDate || todayKey,
          taskId: material.id,
          startPage: 1,
          endPage: targetEnd,
          label: legacy.material ? String(legacy.title || "") : "",
          note: String(legacy.studentNote || ""),
          completed: Boolean(legacy.completed),
          createdAt: legacy.createdAt,
          updatedAt: legacy.updatedAt,
        }, tasks);
      }).filter(Boolean);
    }

    const ddays = Array.isArray(raw.ddays)
      ? raw.ddays.map((item) => {
          const range = C.normalizedRange(item.startDate || item.date, item.endDate || item.date);
          return {
            id: String(item.id || C.newId("dday")),
            title: String(item.title || "").trim(),
            startDate: range.start,
            endDate: range.end,
            color: String(item.color || "#DF8D95"),
            createdAt: String(item.createdAt || item.updatedAt || nowIso()),
            updatedAt: String(item.updatedAt || item.createdAt || nowIso()),
          };
        }).filter((item) => item.title && item.startDate)
      : [];

    const weeklyNotes = raw.weeklyNotes && typeof raw.weeklyNotes === "object"
      ? Object.fromEntries(Object.entries(raw.weeklyNotes).map(([key, value]) => [
          key,
          {
            student: String((value && value.student) || ""),
            teacher: String((value && value.teacher) || ""),
            studentUpdatedAt: String((value && (value.studentUpdatedAt || value.updatedAt)) || ""),
            teacherUpdatedAt: String((value && (value.teacherUpdatedAt || value.updatedAt)) || ""),
            updatedAt: String((value && value.updatedAt) || ""),
          },
        ]))
      : {};

    const examScores = Array.isArray(raw.examScores)
      ? raw.examScores.map((item) => normalizeScore(item, subjects))
      : [];

    const subjectFeedback = {};
    if (raw.subjectFeedback && typeof raw.subjectFeedback === "object") {
      Object.entries(raw.subjectFeedback).forEach(([subjectId, value]) => {
        subjectFeedback[subjectId] = typeof value === "string"
          ? { text: value, updatedAt: "" }
          : {
              text: String((value && value.text) || ""),
              updatedAt: String((value && value.updatedAt) || ""),
            };
      });
    }

    const sourceTombstones = raw.tombstones || {};
    return {
      version: 3,
      subjects,
      tasks,
      plans,
      ddays,
      weeklyNotes,
      examScores,
      subjectFeedback,
      examInfo: normalizeExamInfo(raw.examInfo),
      tombstones: {
        tasks: { ...(sourceTombstones.tasks || {}) },
        plans: { ...(sourceTombstones.plans || {}) },
        ddays: { ...(sourceTombstones.ddays || {}) },
        categories: { ...(sourceTombstones.categories || {}) },
        scores: { ...(sourceTombstones.scores || {}) },
      },
      createdAt: String(raw.createdAt || fallback.createdAt),
      updatedAt: String(raw.updatedAt || fallback.updatedAt),
    };
  }

  function newer(left, right) {
    if (!left) return right;
    if (!right) return left;
    return String(left.updatedAt || "") >= String(right.updatedAt || "") ? left : right;
  }

  function mergeTombstoneMap(left, right) {
    const result = { ...(right || {}), ...(left || {}) };
    const ids = new Set([...Object.keys(left || {}), ...Object.keys(right || {})]);
    ids.forEach((id) => {
      result[id] = String((left || {})[id] || "") >= String((right || {})[id] || "")
        ? left[id]
        : right[id];
    });
    return result;
  }

  function mergeRecordList(leftList, rightList, tombstones) {
    const byId = new Map();
    [...(leftList || []), ...(rightList || [])].forEach((item) => {
      if (!item || !item.id) return;
      byId.set(item.id, newer(byId.get(item.id), item));
    });
    return Array.from(byId.values()).filter((item) => {
      const deletedAt = tombstones && tombstones[item.id];
      return !deletedAt || String(item.updatedAt || "") > String(deletedAt);
    });
  }

  function mergeMaterial(left, right) {
    if (!left) return right;
    if (!right) return left;
    const base = { ...newer(left, right) };
    const tombstones = mergeTombstoneMap(left.studyLogTombstones, right.studyLogTombstones);
    base.studyLogTombstones = tombstones;
    base.studyLogs = mergeRecordList(left.studyLogs, right.studyLogs, tombstones);
    base.createdAt = String(left.createdAt || "") <= String(right.createdAt || "") ? left.createdAt : right.createdAt;
    base.updatedAt = String(left.updatedAt || "") >= String(right.updatedAt || "") ? left.updatedAt : right.updatedAt;
    return base;
  }

  function mergeMaterialList(leftList, rightList, tombstones) {
    const byId = new Map();
    [...(leftList || []), ...(rightList || [])].forEach((item) => {
      if (!item || !item.id) return;
      byId.set(item.id, mergeMaterial(byId.get(item.id), item));
    });
    return Array.from(byId.values()).filter((item) => {
      const deletedAt = tombstones && tombstones[item.id];
      return !deletedAt || String(item.updatedAt || "") > String(deletedAt);
    });
  }

  function mergeWeeklyNote(left, right) {
    if (!left) return right;
    if (!right) return left;
    const studentSource = String(left.studentUpdatedAt || left.updatedAt || "") >= String(right.studentUpdatedAt || right.updatedAt || "") ? left : right;
    const teacherSource = String(left.teacherUpdatedAt || left.updatedAt || "") >= String(right.teacherUpdatedAt || right.updatedAt || "") ? left : right;
    return {
      student: studentSource.student,
      teacher: teacherSource.teacher,
      studentUpdatedAt: studentSource.studentUpdatedAt || studentSource.updatedAt || "",
      teacherUpdatedAt: teacherSource.teacherUpdatedAt || teacherSource.updatedAt || "",
      updatedAt: String(left.updatedAt || "") >= String(right.updatedAt || "") ? left.updatedAt : right.updatedAt,
    };
  }

  function mergeStates(localRaw, remoteRaw) {
    if (!remoteRaw || typeof remoteRaw !== "object") return normalizeState(localRaw);
    if (!localRaw || typeof localRaw !== "object") return normalizeState(remoteRaw);
    const local = normalizeState(localRaw);
    const remote = normalizeState(remoteRaw);
    const tombstones = {
      tasks: mergeTombstoneMap(local.tombstones.tasks, remote.tombstones.tasks),
      plans: mergeTombstoneMap(local.tombstones.plans, remote.tombstones.plans),
      ddays: mergeTombstoneMap(local.tombstones.ddays, remote.tombstones.ddays),
      categories: mergeTombstoneMap(local.tombstones.categories, remote.tombstones.categories),
      scores: mergeTombstoneMap(local.tombstones.scores, remote.tombstones.scores),
    };

    const subjects = SUBJECT_SEED.map((seed, index) => {
      const localSubject = local.subjects.find((item) => item.id === seed.id) || local.subjects[index];
      const remoteSubject = remote.subjects.find((item) => item.id === seed.id) || remote.subjects[index];
      const categories = mergeRecordList(
        (localSubject && localSubject.categories) || [],
        (remoteSubject && remoteSubject.categories) || [],
        tombstones.categories
      );
      return {
        id: seed.id,
        name: seed.name,
        color: seed.color,
        categories: categories.length ? categories : makeSubjects()[index].categories,
      };
    });

    const weeklyNotes = {};
    const weekKeys = new Set([...Object.keys(local.weeklyNotes), ...Object.keys(remote.weeklyNotes)]);
    weekKeys.forEach((key) => {
      weeklyNotes[key] = mergeWeeklyNote(local.weeklyNotes[key], remote.weeklyNotes[key]);
    });

    const subjectFeedback = {};
    SUBJECT_SEED.forEach((seed) => {
      const left = local.subjectFeedback[seed.id];
      const right = remote.subjectFeedback[seed.id];
      if (!left && !right) return;
      subjectFeedback[seed.id] = !left ? right : !right ? left
        : String(left.updatedAt || "") >= String(right.updatedAt || "") ? left : right;
    });

    return normalizeState({
      version: 3,
      subjects,
      tasks: mergeMaterialList(local.tasks, remote.tasks, tombstones.tasks),
      plans: mergeRecordList(local.plans, remote.plans, tombstones.plans),
      ddays: mergeRecordList(local.ddays, remote.ddays, tombstones.ddays),
      weeklyNotes,
      examScores: mergeRecordList(local.examScores, remote.examScores, tombstones.scores),
      subjectFeedback,
      examInfo: String(local.examInfo.updatedAt || "") >= String(remote.examInfo.updatedAt || "")
        ? local.examInfo
        : remote.examInfo,
      tombstones,
      createdAt: String(local.createdAt || "") <= String(remote.createdAt || "") ? local.createdAt : remote.createdAt,
      updatedAt: String(local.updatedAt || "") >= String(remote.updatedAt || "") ? local.updatedAt : remote.updatedAt,
    });
  }

  function storageKeyForBin(binId) {
    return binId ? `${STORAGE_PREFIX}${binId}` : LEGACY_STORAGE_KEY;
  }

  function incomingBinFromUrl() {
    if (!location.hash.startsWith("#")) return "";
    const params = new URLSearchParams(location.hash.slice(1));
    return String(params.get("bin") || "").trim();
  }

  function loadLocalState(options) {
    const settings = options || {};
    try {
      let raw = localStorage.getItem(STORAGE_KEY);
      if (!raw && settings.allowLegacy && STORAGE_KEY !== LEGACY_STORAGE_KEY) {
        raw = localStorage.getItem(LEGACY_STORAGE_KEY);
      }
      const normalized = normalizeState(raw ? JSON.parse(raw) : null);
      if (raw && !localStorage.getItem(STORAGE_KEY)) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(normalized));
      }
      return normalized;
    } catch (_) {
      return defaultState();
    }
  }

  function loadCloudConfig() {
    try {
      const parsed = JSON.parse(localStorage.getItem(CLOUD_KEY) || "{}");
      return {
        binId: String(parsed.binId || ""),
        key: String(parsed.key || ""),
        keyType: parsed.keyType === "master" ? "master" : "access",
        status: parsed.binId && parsed.key ? "연결 준비" : "로컬 저장",
        lastSync: String(parsed.lastSync || ""),
        pending: false,
      };
    } catch (_) {
      return { binId: "", key: "", keyType: "access", status: "로컬 저장", lastSync: "", pending: false };
    }
  }

  let cloud = loadCloudConfig();
  const incomingBinId = incomingBinFromUrl();
  openedFromShareLink = Boolean(incomingBinId);
  const incomingChangesContext = Boolean(incomingBinId && incomingBinId !== cloud.binId);
  if (incomingBinId) {
    cloud.binId = incomingBinId;
    cloud.status = cloud.key ? "연결 준비" : "동기화 키 필요";
    saveCloudConfig();
    history.replaceState(null, "", location.pathname + location.search);
  }
  STORAGE_KEY = storageKeyForBin(cloud.binId);
  let state = loadLocalState({ allowLegacy: !incomingChangesContext });
  const initialSubject = state.subjects[0] ? state.subjects[0].id : "kor";
  const ui = {
    page: "weekly",
    selectedDate: todayKey,
    miniMonth: `${todayKey.slice(0, 7)}-01`,
    monthDate: `${todayKey.slice(0, 7)}-01`,
    studyWeek: C.weekKey(todayKey),
    studyMonth: `${todayKey.slice(0, 7)}-01`,
    studySubject: "all",
    selectedSubject: initialSubject,
    selectedCategory: "all",
    learningFilter: "active",
    commonCollapsed: false,
  };

  function saveCloudConfig() {
    localStorage.setItem(CLOUD_KEY, JSON.stringify({
      binId: cloud.binId,
      key: cloud.key,
      keyType: cloud.keyType,
      lastSync: cloud.lastSync,
    }));
  }

  function switchStateStorage(binId, options) {
    const settings = options || {};
    const nextKey = storageKeyForBin(binId);
    if (nextKey === STORAGE_KEY) return;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    STORAGE_KEY = nextKey;
    if (settings.keepCurrent) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      return;
    }
    state = loadLocalState({ allowLegacy: false });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function showToast(message) {
    clearTimeout(toastTimer);
    toastEl.textContent = message;
    toastEl.classList.add("show");
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2700);
  }

  function persist(options) {
    const settings = options || {};
    state.updatedAt = nowIso();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (_) {
      showToast("브라우저 저장 공간이 부족합니다. JSON 백업을 먼저 내려받아 주세요.");
      return false;
    }
    if (settings.sync === false) return true;
    cloud.pending = Boolean(cloud.binId && cloud.key);
    if (cloud.pending) cloud.status = cloudCanPush ? "동기화 대기" : "로컬 저장 · 수동 동기화 필요";
    if (cloudCanPush) scheduleCloudPush();
    return true;
  }

  function subjectById(id) {
    return state.subjects.find((subject) => subject.id === id) || state.subjects[0];
  }

  function materialById(id) {
    return state.tasks.find((task) => task.id === id);
  }

  function planById(id) {
    return state.plans.find((plan) => plan.id === id);
  }

  function categoryById(subject, id) {
    return subject && subject.categories.find((category) => category.id === id);
  }

  function categoryAccent(subject, categoryId) {
    const subjectIndex = Math.max(0, state.subjects.findIndex((item) => item.id === subject.id));
    const categoryIndex = Math.max(0, subject.categories.findIndex((item) => item.id === categoryId));
    return CATEGORY_COLORS[(categoryIndex + subjectIndex * 2) % CATEGORY_COLORS.length];
  }

  function moveMonth(dateKey, amount) {
    const date = C.parseDateKey(dateKey);
    date.setMonth(date.getMonth() + amount, 1);
    return C.toDateKey(date);
  }

  function weekRangeLabel(dateValue) {
    const start = C.startOfWeek(dateValue);
    const end = C.endOfWeek(dateValue);
    return `${start.getFullYear()}.${String(start.getMonth() + 1).padStart(2, "0")}.${String(start.getDate()).padStart(2, "0")} — ${end.getFullYear()}.${String(end.getMonth() + 1).padStart(2, "0")}.${String(end.getDate()).padStart(2, "0")}`;
  }

  function formatShortDate(dateKey) {
    const date = C.parseDateKey(dateKey);
    return date ? `${date.getMonth() + 1}.${date.getDate()}` : "";
  }

  function materialProgress(material) {
    if (!material) return 0;
    if (material.completed) return 100;
    return C.clamp(Math.round((Number(material.completedPages || 0) / Number(material.totalPages || 1)) * 100), 0, 100);
  }

  function overallProgress(materials) {
    const list = materials || state.tasks;
    const total = list.reduce((sum, item) => sum + Number(item.totalPages || 0), 0);
    const done = list.reduce((sum, item) => sum + (item.completed ? Number(item.totalPages || 0) : Number(item.completedPages || 0)), 0);
    return total ? Math.round((done / total) * 100) : 0;
  }

  function plansForDate(dateKey) {
    return state.plans
      .filter((plan) => plan.date === dateKey)
      .sort((a, b) => Number(a.completed) - Number(b.completed) || a.createdAt.localeCompare(b.createdAt));
  }

  function plansForWeek(dateValue) {
    const start = C.toDateKey(C.startOfWeek(dateValue));
    const end = C.toDateKey(C.endOfWeek(dateValue));
    return state.plans.filter((plan) => plan.date >= start && plan.date <= end);
  }

  function planProgress(plans) {
    if (!plans.length) return 0;
    let total = 0;
    let done = 0;
    plans.forEach((plan) => {
      const pages = Math.max(1, Number(plan.endPage) - Number(plan.startPage) + 1);
      total += pages;
      if (plan.completed) done += pages;
    });
    return total ? Math.round((done / total) * 100) : 0;
  }

  function studySummary(startDate, endDate) {
    const byDate = {};
    const bySubject = {};
    let total = 0;
    const logs = [];
    state.tasks.forEach((material) => {
      material.studyLogs.forEach((log) => {
        if (log.date < startDate || log.date > endDate) return;
        if (!byDate[log.date]) byDate[log.date] = {};
        byDate[log.date][material.subjectId] = (byDate[log.date][material.subjectId] || 0) + log.minutes;
        bySubject[material.subjectId] = (bySubject[material.subjectId] || 0) + log.minutes;
        total += log.minutes;
        logs.push({ ...log, material });
      });
    });
    logs.sort((a, b) => b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt));
    return { byDate, bySubject, total, logs };
  }

  function dailyTotal(dateKey, subjectId) {
    return state.tasks
      .filter((material) => !subjectId || subjectId === "all" || material.subjectId === subjectId)
      .reduce((sum, material) => (
      sum + material.studyLogs
        .filter((log) => log.date === dateKey)
        .reduce((subtotal, log) => subtotal + log.minutes, 0)
    ), 0);
  }

  function heatLevel(minutes) {
    if (!minutes) return 0;
    if (minutes <= 60) return 1;
    if (minutes <= 120) return 2;
    if (minutes <= 240) return 3;
    if (minutes <= 360) return 4;
    return 5;
  }

  function quoteForDate(dateKey) {
    const date = C.parseDateKey(dateKey) || new Date();
    const index = Math.abs(Math.floor(date.getTime() / 86400000)) % MOTIVATION_QUOTES.length;
    return MOTIVATION_QUOTES[index];
  }

  function cheerForDate(dateKey) {
    const date = C.parseDateKey(dateKey) || new Date();
    const dayNumber = Math.abs(Math.floor(date.getTime() / 86400000));
    return CHEER_MESSAGES[(dayNumber + 17) % CHEER_MESSAGES.length];
  }

  function fixedAndCustomDdays() {
    const duplicateFixed = state.ddays.some((item) => item.endDate === FIXED_EXAM.endDate && /수능/.test(item.title));
    return duplicateFixed ? state.ddays : [FIXED_EXAM, ...state.ddays];
  }

  function stateFingerprint(value) {
    const copy = normalizeState(JSON.parse(JSON.stringify(value)));
    copy.createdAt = "";
    copy.updatedAt = "";
    copy.tasks.sort((a, b) => a.id.localeCompare(b.id));
    copy.tasks.forEach((task) => task.studyLogs.sort((a, b) => a.id.localeCompare(b.id)));
    copy.plans.sort((a, b) => a.id.localeCompare(b.id));
    copy.ddays.sort((a, b) => a.id.localeCompare(b.id));
    copy.examScores.sort((a, b) => a.id.localeCompare(b.id));
    copy.subjects.forEach((subject) => subject.categories.sort((a, b) => a.id.localeCompare(b.id)));
    return JSON.stringify(copy);
  }

  function renderPlanSlip(plan) {
    const material = materialById(plan.taskId);
    if (!material) return "";
    const subject = subjectById(material.subjectId);
    const accent = categoryAccent(subject, material.categoryId);
    return `
      <article class="task-slip plan-slip ${plan.completed ? "checked" : ""}" style="--task-color:${accent}">
        <button class="plan-slip-main" data-action="open-plan-detail" data-id="${esc(plan.id)}" aria-label="${esc(material.title)} 상세 보기">
          <strong>${esc(material.title)}</strong>
          <span class="target-pages">p.${plan.startPage}–${plan.endPage}</span>
        </button>
        <button class="plan-check" data-action="complete-plan" data-id="${esc(plan.id)}" aria-label="${plan.completed ? "완료 취소" : "학습 완료 후 시간 기록"}" aria-pressed="${plan.completed}">
          ${plan.completed ? "✓" : ""}
        </button>
      </article>`;
  }

  function eventsForMonthDate(dateKey) {
    const events = [];
    state.plans.filter((plan) => plan.date === dateKey).forEach((plan) => {
      const material = materialById(plan.taskId);
      if (!material) return;
      const subject = subjectById(material.subjectId);
      events.push({
        type: "plan",
        title: `${subject.name} · ${plan.label || material.title} p.${plan.startPage}–${plan.endPage}`,
        color: subject.color,
      });
    });
    state.tasks.filter((material) => material.deadline === dateKey).forEach((material) => {
      const subject = subjectById(material.subjectId);
      events.push({ type: "dday", title: `마감 · ${material.title}`, color: subject.color });
    });
    fixedAndCustomDdays().filter((item) => C.rangeContains(item.startDate, item.endDate, dateKey)).forEach((item) => {
      events.push({ type: "dday", title: item.title, color: item.color });
    });
    return events;
  }

  function renderStudyPage() {
    const start = C.startOfWeek(ui.studyWeek);
    const end = C.endOfWeek(ui.studyWeek);
    const days = Array.from({ length: 7 }, (_, index) => C.addDays(start, index));
    const summary = studySummary(C.toDateKey(start), C.toDateKey(end));
    const selectedStudySubject = ui.studySubject === "all" ? null : subjectById(ui.studySubject);
    const dailyTotals = days.map((day) => {
      const bySubject = summary.byDate[C.toDateKey(day)] || {};
      return selectedStudySubject
        ? Number(bySubject[selectedStudySubject.id] || 0)
        : Object.values(bySubject).reduce((sum, minutes) => sum + minutes, 0);
    });
    const viewTotal = dailyTotals.reduce((sum, minutes) => sum + minutes, 0);
    const viewLogs = selectedStudySubject
      ? summary.logs.filter((log) => log.material.subjectId === selectedStudySubject.id)
      : summary.logs;
    const maxDaily = Math.max(1, ...dailyTotals);
    const activeDays = dailyTotals.filter((minutes) => minutes > 0).length;
    const bestIndex = dailyTotals.indexOf(Math.max(...dailyTotals));
    return `
      ${renderPageHeader(
        "Study volume",
        "공부량 기록",
        "주간 합계와 날짜별 과목 공부시간을 확인하고, 월간 달력의 색 농도로 공부량을 비교합니다.",
        `<button class="primary-btn" data-action="open-quick-log">＋ 공부시간 기록</button>`
      )}
      ${renderHeatCalendar()}
      <div class="week-controls">
        <button class="icon-btn" data-action="study-week-prev" aria-label="이전 주">←</button>
        <button class="week-stamp" data-action="study-week-today">${weekRangeLabel(ui.studyWeek)}</button>
        <button class="icon-btn" data-action="study-week-next" aria-label="다음 주">→</button>
      </div>
      <section class="stats-grid">
        <article class="stat-card"><span>${selectedStudySubject ? esc(selectedStudySubject.name) : "전체"} 주간 공부시간</span><strong>${C.formatMinutes(viewTotal)}</strong></article>
        <article class="stat-card"><span>하루 평균</span><strong>${C.formatMinutes(Math.round(viewTotal / 7))}</strong></article>
        <article class="stat-card"><span>공부한 날</span><strong>${activeDays}<small style="font-size:12px"> / 7일</small></strong></article>
        <article class="stat-card"><span>가장 집중한 날</span><strong>${viewTotal ? WEEKDAYS_LONG[bestIndex] : "—"}</strong></article>
      </section>
      <section class="study-grid">
        <div class="paper-card chart-card">
          <h2 class="chart-title">날짜별 과목 공부시간</h2>
          <p class="chart-subtitle">막대의 색은 과목, 전체 높이는 하루 총 공부시간입니다.</p>
          <div class="bar-chart" role="img" aria-label="날짜별 과목 공부시간 막대그래프">
            ${days.map((day, index) => {
              const key = C.toDateKey(day);
              const map = summary.byDate[key] || {};
              const total = dailyTotals[index];

  function renderScoreChart(scores, subject) {
    if (!scores.length) return `<div class="empty-state" style="min-height:210px"><div><strong>첫 성적을 기록해 보세요</strong><p>시험 날짜와 원점수를 입력하면 과목별 변화가 선 그래프로 표시됩니다.</p><button class="primary-btn" data-action="open-score">성적 기록</button></div></div>`;
    const width = 620;
    const height = 250;
    const left = 44;
    const right = 24;
    const top = 22;
    const bottom = 48;
    const usableWidth = width - left - right;
    const usableHeight = height - top - bottom;
    const points = scores.map((score, index) => {
      const x = scores.length === 1 ? left + usableWidth / 2 : left + (index / (scores.length - 1)) * usableWidth;
      const y = top + ((100 - score.score) / 100) * usableHeight;
      return { x, y, score };
    });
    return `<div class="score-chart-wrap">
      <svg class="score-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(subject.name)} 모의고사 원점수 추이">
        ${[0, 25, 50, 75, 100].map((value) => {
          const y = top + ((100 - value) / 100) * usableHeight;
          return `<line class="score-grid-line" x1="${left}" y1="${y}" x2="${width - right}" y2="${y}"></line><text class="score-axis-text" x="8" y="${y + 4}">${value}</text>`;
        }).join("")}
        <polyline class="score-line" style="--subject-color:${subject.color}" points="${points.map((point) => `${point.x},${point.y}`).join(" ")}"></polyline>
        ${points.map((point) => `
          <circle class="score-dot" style="--subject-color:${subject.color}" cx="${point.x}" cy="${point.y}" r="6"><title>${esc(point.score.examName)} · ${point.score.score}점 · ${point.score.grade}등급</title></circle>
          <text class="score-axis-text" x="${point.x}" y="${height - 24}" text-anchor="middle">${esc(formatShortDate(point.score.date))}</text>
          <text class="score-axis-text" x="${point.x}" y="${point.y - 11}" text-anchor="middle" style="font-weight:900;fill:${subject.color}">${point.score.score}</text>
        `).join("")}
      </svg>
    </div>`;
  }

      if (existing) {
        existing.title = title;
        existing.subjectId = nextSubject.id;
        existing.categoryId = categoryIdValue;
        existing.totalPages = totalPages;
        existing.completedPages = Math.min(existing.completedPages, totalPages);

          id: C.newId("material"),
          subjectId: nextSubject.id,
          categoryId: categoryIdValue,
          title,
          legacyAssignment: "",
          deadline,
          totalPages,
          completedPages: 0,
          completed: false,
          studyLogs: [],
          studyLogTombstones: {},
          createdAt: stamp,
          updatedAt: stamp,

  function openPlanModal(planId, preferredMaterialId, preferredDate) {

    const existing = planId ? planById(planId) : null;
    const preferredMaterial = materialById(existing?.taskId || preferredMaterialId);
    let subjectId = preferredMaterial?.subjectId || ui.selectedSubject || state.tasks[0].subjectId;
    let subjectMaterials = state.tasks.filter((material) => material.subjectId === subjectId);
    const material = preferredMaterial || subjectMaterials[0] || state.tasks[0];
    if (!subjectMaterials.length) {
      subjectId = material.subjectId;
      subjectMaterials = state.tasks.filter((item) => item.subjectId === subjectId);
    }
    const defaultStart = existing?.startPage || Math.min(material.totalPages, Math.max(1, material.completedPages + 1));
    const defaultEnd = existing?.endPage || Math.min(material.totalPages, defaultStart + 9);
    openModal(existing ? "주간 학습 수정" : "주간 학습 추가", `

        <div class="modal-body">
          <div class="form-grid">

              <label for="planSubject">과목 *</label>

                ${state.subjects.map((item) => `<option value="${item.id}" ${item.id === subjectId ? "selected" : ""}>${esc(item.name)}</option>`).join("")}

            <div class="form-group">
              <label for="planEndPage">목표 마지막 페이지 *</label>
              <input class="form-control" id="planEndPage" type="number" min="1" max="${material.totalPages}" inputmode="numeric" required value="${defaultEnd}">
            </div>
            <div class="form-group full">
              <label for="planLabel">학습 내용 메모</label>
              <input class="form-control" id="planLabel" maxlength="100" value="${esc(existing?.label || "")}" placeholder="예: 3점 기출 20문제, 2단원 개념 복습">
            </div>
          </div>
          <p class="chart-subtitle" id="planPageHelp">선택한 교재는 전체 ${material.totalPages}쪽입니다.</p>
        </div>
        <div class="modal-actions">
          <button type="button" class="soft-btn" data-action="close-modal">취소</button>
