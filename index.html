<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf9fc">
  <meta name="description" content="수능까지의 주간 학습, 과목별 진도, 공부시간, 숙제 검사와 피드백을 함께 기록하는 반응형 학습 관리 플래너">
  <meta property="og:type" content="website">
  <meta property="og:title" content="민서의 학습 노트">
  <meta property="og:description" content="선생님과 학생이 함께 쓰는 반응형 수능 학습 플래너">
  <meta property="og:image" content="social-preview.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>민서의 학습 노트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <style>
:root {
  --paper: #f4efe4;
  --paper-2: #fbf8f0;
  --paper-3: #e9dfcd;
  --ink: #27251f;
  --muted: #766f63;
  --line: #d7cbb7;
  --line-strong: #b9aa92;
  --forest: #315f55;
  --forest-soft: #dfe9df;
  --navy: #3f5f82;
  --brick: #a6493c;
  --mustard: #c89542;
  --shadow: 0 14px 40px rgba(82, 65, 41, 0.10);
  --shadow-soft: 0 5px 18px rgba(82, 65, 41, 0.08);
  --serif: Georgia, "Noto Serif KR", "Batang", serif;
  --sans: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
}

html.dark {
  --paper: #171b18;
  --paper-2: #222620;
  --paper-3: #2d3129;
  --ink: #f0eadc;
  --muted: #aaa393;
  --line: #3d433a;
  --line-strong: #5d6256;
  --forest: #9abd9b;
  --forest-soft: #27382d;
  --navy: #8da8c8;
  --brick: #d98070;
  --mustard: #dfb765;
  --shadow: 0 16px 44px rgba(0, 0, 0, 0.25);
  --shadow-soft: 0 7px 20px rgba(0, 0, 0, 0.18);
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-text-size-adjust: 100%;
}

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  background:
    radial-gradient(circle at 18% 8%, rgba(255,255,255,.52), transparent 24rem),
    repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(98,74,43,.018) 4px),
    var(--paper);
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  color: inherit;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--forest) 32%, transparent);
  outline-offset: 2px;
}

.app-frame {
  width: min(1760px, 100%);
  min-height: 100vh;
  margin: 0 auto;
  background: color-mix(in srgb, var(--paper-2) 86%, transparent);
  border-inline: 1px solid var(--line);
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 22px;
  min-height: 76px;
  padding: 12px 24px;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--paper-2) 92%, transparent);
  backdrop-filter: blur(16px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: max-content;
}

.brand-mark {
  display: grid;
  width: 42px;
  height: 50px;
  place-items: center;
  color: #f7f0de;
  font-family: var(--serif);
  font-size: 18px;
  border-radius: 5px 12px 12px 5px;
  background:
    linear-gradient(90deg, rgba(255,255,255,.15) 0 4px, transparent 4px),
    var(--forest);
  box-shadow: 4px 5px 0 var(--paper-3);
}

.brand-copy strong {
  display: block;
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -.035em;
}

.brand-copy span {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .06em;
}

.desktop-nav {
  display: flex;
  justify-content: center;
  gap: 5px;
}

.nav-btn,
.icon-btn,
.soft-btn,
.primary-btn,
.danger-btn,
.chip,
.subject-tab {
  border: 0;
  cursor: pointer;
  transition: transform .16s ease, background .16s ease, border-color .16s ease, color .16s ease;
}

.nav-btn {
  min-width: 86px;
  padding: 10px 14px;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
}

.nav-btn:hover,
.nav-btn.active {
  color: var(--paper-2);
  background: var(--forest);
}

.top-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}

.sync-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  max-width: 160px;
  padding: 8px 11px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--paper-2);
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
  text-overflow: ellipsis;
  cursor: pointer;
}

.sync-dot {
  width: 8px;
  height: 8px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--line-strong);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--line) 45%, transparent);
}

.sync-pill.connected .sync-dot {
  background: #4f8b66;
  box-shadow: 0 0 0 4px rgba(79,139,102,.15);
}

.icon-btn {
  display: inline-grid;
  width: 40px;
  height: 40px;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--paper-2);
  font-size: 17px;
}

.icon-btn:hover,
.soft-btn:hover,
.subject-tab:hover,
.chip:hover {
  transform: translateY(-1px);
  border-color: var(--line-strong);
}

.workspace {
  display: grid;
  grid-template-columns: 270px minmax(0, 1fr);
  align-items: start;
  min-height: calc(100vh - 76px);
}

.common-panel {
  position: sticky;
  top: 76px;
  height: calc(100vh - 76px);
  padding: 18px 16px 28px;
  overflow: auto;
  border-right: 1px solid var(--line);
  background:
    linear-gradient(90deg, color-mix(in srgb, var(--forest) 9%, var(--paper-2)) 0 14px, transparent 14px),
    var(--paper-2);
}

.common-panel::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 5px;
  width: 1px;
  background: color-mix(in srgb, var(--line-strong) 55%, transparent);
}

.rail-label {
  margin: 0 0 12px 10px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .15em;
  text-transform: uppercase;
}

.mini-calendar,
.dday-panel {
  margin-left: 10px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--paper-2);
  box-shadow: var(--shadow-soft);
}

.mini-calendar {
  padding: 14px;
}

.calendar-head,
.panel-head,
.section-head,
.page-title-row,
.week-controls,
.task-card-head,
.task-meta-row,
.inline-actions,
.progress-head,
.cloud-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.calendar-title {
  border: 0;
  background: transparent;
  color: var(--ink);
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

.tiny-btn {
  display: inline-grid;
  width: 28px;
  height: 28px;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--paper-2);
  color: var(--muted);
  cursor: pointer;
}

.mini-weekdays,
.mini-days {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 3px;
}

.mini-weekdays {
  margin-top: 13px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 900;
  text-align: center;
}

.mini-days {
  margin-top: 7px;
}

.mini-day {
  position: relative;
  display: grid;
  min-height: 27px;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--ink);
  font-size: 10px;
  cursor: pointer;
}

.mini-day.outside {
  color: color-mix(in srgb, var(--muted) 45%, transparent);
}

.mini-day.selected {
  background: var(--forest-soft);
  box-shadow: inset 0 0 0 1px var(--forest);
}

.mini-day.today {
  color: var(--paper-2);
  background: var(--forest);
  font-weight: 900;
}

.mini-day.has-mark::after {
  content: "";
  position: absolute;
  right: 4px;
  bottom: 3px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--brick);
}

.dday-panel {
  margin-top: 14px;
  padding: 14px;
}

.panel-head h2,
.section-head h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: 16px;
}

.dday-list {
  display: grid;
  gap: 8px;
  margin-top: 12px;
}

.dday-ticket {
  position: relative;
  padding: 10px 28px 10px 11px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-left: 4px solid var(--brick);
  border-radius: 10px;
  background:
    radial-gradient(circle at 100% 50%, var(--paper-2) 0 6px, transparent 6.5px),
    color-mix(in srgb, var(--brick) 6%, var(--paper-2));
}

.ticket-main {
  display: block;
  width: 100%;
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  text-align: left;
  cursor: pointer;
}

.dday-ticket strong {
  display: block;
  overflow: hidden;
  font-size: 12px;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.dday-ticket span {
  display: block;
  margin-top: 3px;
  color: var(--brick);
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 800;
}

.dday-ticket small {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 9px;
}

.ticket-delete {
  position: absolute;
  top: 7px;
  right: 7px;
  border: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}

.empty-rail {
  padding: 14px 5px 4px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.55;
  text-align: center;
}

.main-content {
  min-width: 0;
  padding: 26px clamp(18px, 2.4vw, 40px) 110px;
}

.page-title-row {
  align-items: flex-end;
  margin-bottom: 20px;
}

.eyebrow {
  margin: 0 0 5px;
  color: var(--forest);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .16em;
  text-transform: uppercase;
}

.page-title {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(28px, 3vw, 45px);
  font-weight: 700;
  letter-spacing: -.045em;
}

.page-subtitle {
  max-width: 700px;
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.65;
}

.primary-btn,
.soft-btn,
.danger-btn {
  min-height: 40px;
  padding: 9px 14px;
  border-radius: 11px;
  font-size: 12px;
  font-weight: 900;
}

.primary-btn {
  color: #fffaf0;
  background: var(--forest);
  box-shadow: 0 5px 0 color-mix(in srgb, var(--forest) 50%, #000);
}

.primary-btn:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 color-mix(in srgb, var(--forest) 50%, #000);
}

.soft-btn {
  border: 1px solid var(--line);
  background: var(--paper-2);
}

.danger-btn {
  border: 1px solid color-mix(in srgb, var(--brick) 40%, var(--line));
  background: color-mix(in srgb, var(--brick) 8%, var(--paper-2));
  color: var(--brick);
}

.week-controls {
  justify-content: flex-start;
  margin-bottom: 16px;
}

.week-stamp {
  min-width: 230px;
  padding: 10px 18px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--paper-2);
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 700;
  text-align: center;
  box-shadow: var(--shadow-soft);
}

.week-progress {
  display: grid;
  grid-template-columns: auto minmax(140px, 1fr) auto;
  align-items: center;
  gap: 12px;
  width: min(460px, 100%);
  margin-left: auto;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
}

.progress-track {
  height: 8px;
  overflow: hidden;
  border-radius: 99px;
  background: var(--paper-3);
}

.progress-fill {
  height: 100%;
  border-radius: inherit;
  background: var(--forest);
  transition: width .25s ease;
}

.week-spread {
  display: grid;
  grid-template-columns: repeat(5, minmax(136px, 1fr)) minmax(150px, .9fr);
  gap: 12px;
  align-items: stretch;
}

.weekend-stack {
  display: grid;
  grid-template-rows: 1fr 1fr;
  gap: 12px;
  min-width: 0;
}

.day-card {
  position: relative;
  min-width: 0;
  min-height: 410px;
  padding: 14px 12px 15px 25px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background:
    linear-gradient(90deg, transparent 0 21px, color-mix(in srgb, var(--line) 65%, transparent) 21px 22px, transparent 22px),
    var(--paper-2);
  box-shadow: var(--shadow-soft);
}

.day-card.weekend {
  min-height: 199px;
}

.day-card.today {
  border-color: var(--forest);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--forest) 10%, transparent), var(--shadow-soft);
}

.day-card::before {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  width: 26px;
  height: 26px;
  border-radius: 0 14px 0 8px;
  background: var(--paper-3);
  clip-path: polygon(100% 0, 100% 100%, 0 0);
}

.day-card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 12px;
}

.day-number {
  font-family: var(--serif);
  font-size: 33px;
  line-height: 1;
}

.day-name {
  color: var(--muted);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .1em;
}

.day-name.sun {
  color: var(--brick);
}

.day-task-list {
  display: grid;
  gap: 8px;
}

.task-slip {
  position: relative;
  padding: 9px 8px 9px 11px;
  overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--task-color) 30%, var(--line));
  border-left: 4px solid var(--task-color);
  border-radius: 9px;
  background: color-mix(in srgb, var(--task-color) 9%, var(--paper-2));
  cursor: pointer;
}

.task-slip.checked {
  opacity: .6;
}

.task-slip.checked strong {
  text-decoration: line-through;
}

.task-slip strong {
  display: block;
  overflow: hidden;
  font-size: 11px;
  line-height: 1.35;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.task-slip span {
  display: block;
  margin-top: 3px;
  overflow: hidden;
  color: var(--muted);
  font-size: 9px;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.task-slip .mini-progress {
  height: 3px;
  margin-top: 7px;
  border-radius: 9px;
  background: var(--paper-3);
}

.task-slip .mini-progress i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--task-color);
}

.day-empty {
  display: grid;
  min-height: 120px;
  place-items: center;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 12px;
  text-align: center;
}

.more-count {
  padding: 4px 8px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 800;
  text-align: center;
}

.weekly-bottom {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr);
  gap: 16px;
  margin-top: 18px;
}

.paper-card {
  border: 1px solid var(--line);
  border-radius: 17px;
  background: var(--paper-2);
  box-shadow: var(--shadow-soft);
}

.feedback-book {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 250px;
  overflow: hidden;
}

.feedback-page {
  padding: 18px;
}

.feedback-page + .feedback-page {
  border-left: 1px dashed var(--line-strong);
}

.feedback-page h3 {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 17px;
}

.lined-textarea {
  width: 100%;
  min-height: 150px;
  padding: 7px 8px;
  resize: vertical;
  border: 0;
  border-radius: 8px;
  outline: none;
  background:
    repeating-linear-gradient(transparent, transparent 25px, color-mix(in srgb, var(--line) 72%, transparent) 26px);
  color: var(--ink);
  font-size: 12px;
  line-height: 26px;
}

.deadline-list {
  padding: 18px;
}

.deadline-list h3 {
  margin: 0 0 12px;
  font-family: var(--serif);
  font-size: 17px;
}

.deadline-row {
  display: grid;
  grid-template-columns: 10px minmax(0, 1fr) auto;
  align-items: center;
  gap: 9px;
  padding: 9px 0;
  border-top: 1px dotted var(--line);
  font-size: 11px;
}

.deadline-row:first-of-type {
  border-top: 0;
}

.color-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--dot-color);
}

.deadline-row small {
  color: var(--muted);
}

.month-shell {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--paper-2);
  box-shadow: var(--shadow);
}

.month-weekdays,
.month-days {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
}

.month-weekdays {
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--paper-3) 45%, var(--paper-2));
}

.month-weekdays div {
  padding: 10px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .08em;
  text-align: center;
}

.month-week {
  position: relative;
  min-height: 132px;
  border-bottom: 1px solid var(--line);
}

.month-week:last-child {
  border-bottom: 0;
}

.month-days {
  position: absolute;
  inset: 0;
}

.month-day {
  min-width: 0;
  padding: 8px;
  border-right: 1px solid var(--line);
  background: var(--paper-2);
  cursor: pointer;
}

.month-day:last-child {
  border-right: 0;
}

.month-day.outside {
  background: color-mix(in srgb, var(--paper) 65%, var(--paper-2));
  color: color-mix(in srgb, var(--muted) 55%, transparent);
}

.month-day.today {
  background: color-mix(in srgb, var(--forest) 9%, var(--paper-2));
}

.month-day strong {
  display: inline-grid;
  min-width: 25px;
  height: 25px;
  place-items: center;
  border-radius: 50%;
  font-family: var(--serif);
  font-size: 13px;
}

.month-day.today strong {
  color: var(--paper-2);
  background: var(--forest);
}

.gantt-layer {
  position: absolute;
  top: 38px;
  right: 4px;
  bottom: 4px;
  left: 4px;
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  grid-auto-rows: 20px;
  gap: 3px 0;
  pointer-events: none;
}

.gantt-bar {
  align-self: center;
  min-width: 0;
  height: 18px;
  padding: 1px 7px;
  overflow: hidden;
  border-left: 3px solid var(--bar-color);
  border-radius: 4px;
  background: color-mix(in srgb, var(--bar-color) 18%, var(--paper-2));
  color: var(--ink);
  font-size: 9px;
  font-weight: 800;
  line-height: 16px;
  white-space: nowrap;
  text-overflow: ellipsis;
  box-shadow: 0 1px 3px rgba(68,55,38,.08);
}

.gantt-bar.dday {
  border: 1px dashed var(--bar-color);
  border-left-width: 3px;
  background: color-mix(in srgb, var(--bar-color) 10%, var(--paper-2));
}

.gantt-more {
  position: absolute;
  right: 8px;
  bottom: 5px;
  padding: 3px 7px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--paper-2);
  color: var(--muted);

.mobile-nav {

}

.mini-calendar,
.dday-panel,
.paper-card,
.day-card,
.month-shell,
.stat-card,
.task-card,
.modal,
.week-stamp,
.icon-btn,
.soft-btn,
.subject-tab,
.chip {
  border-color: var(--line);
  background-color: var(--paper-2);
}

.mini-calendar,
.dday-panel,
.paper-card,
.day-card,
.month-shell,
.stat-card,
.task-card {
  box-shadow: var(--shadow-soft);
}

.num,
.day-number,
.overall-number,
.stat-card strong,
.week-stamp,
.dday-ticket span,
.calendar-title,
.mini-day,
.month-day strong,
.bar-label,
.badge,
.progress-head strong,
.score-value,
.heat-minutes,
.exam-time {
  font-family: var(--number);
  font-variant-numeric: tabular-nums lining-nums;
  letter-spacing: -.01em;
}

.week-spread {
  grid-template-columns: repeat(7, minmax(118px, 1fr));
}

.day-card,
.day-card.weekend {
  min-height: 360px;
}

.daily-quote {
  margin: 14px 0 0 10px;
  padding: 15px;
  border: 1px solid color-mix(in srgb, var(--mustard) 45%, var(--line));
  border-radius: 16px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--mustard) 12%, var(--paper-2)), var(--paper-2));
  box-shadow: var(--shadow-soft);
}

.daily-quote .quote-label {
  display: block;
  margin-bottom: 7px;
  color: var(--mustard);
  font-size: 9px;
  font-weight: 900;
  letter-spacing: .13em;
  text-transform: uppercase;
}

.daily-quote p {
  margin: 0;
  font-family: var(--serif);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.65;
}

.fixed-dday {
  border-width: 2px;
  border-left-width: 6px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--brick) 15%, var(--paper-2)), var(--paper-2));
}

.fixed-label {
  display: inline-flex;
  margin-bottom: 5px;
  padding: 3px 6px;
  border-radius: 999px;
  background: var(--brick);
  color: #fff;
  font-size: 8px;
  font-weight: 900;
  letter-spacing: .08em;
}

.plan-slip {
  min-height: 88px;
}

.plan-slip .target-pages {
  color: var(--ink);
  font-family: var(--number);
  font-size: 10px;
  font-weight: 900;
}

.month-simple-grid,
.heat-calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
}

.month-simple-day {
  min-height: 125px;
  padding: 8px;
  overflow: hidden;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--paper-2);
}

.month-simple-day:nth-child(7n) {
  border-right: 0;
}

.month-simple-day.outside {
  background: color-mix(in srgb, var(--paper) 78%, var(--paper-2));
  color: color-mix(in srgb, var(--muted) 65%, transparent);
}

.month-simple-day.today {
  background: color-mix(in srgb, var(--forest) 12%, var(--paper-2));
  box-shadow: inset 0 0 0 2px var(--forest);
}

.month-simple-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.month-simple-head strong {
  display: inline-grid;
  min-width: 27px;
  height: 27px;
  place-items: center;
  border-radius: 50%;
  font-family: var(--number);
  font-size: 12px;
}

.month-simple-day.today .month-simple-head strong {
  background: var(--forest);
  color: #fff;
}

.month-event-list {
  display: grid;
  gap: 4px;
}

.month-event {
  display: block;
  padding: 5px 6px;
  overflow: hidden;
  border-left: 3px solid var(--event-color);
  border-radius: 5px;
  background: color-mix(in srgb, var(--event-color) 15%, var(--paper-2));
  color: var(--ink);
  font-size: 9px;
  font-weight: 800;
  line-height: 1.25;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.month-event.dday {
  border: 1px dashed var(--event-color);
  border-left-width: 3px;
}

.material-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.material-card {
  padding: 17px;
  border: 1px solid var(--line);
  border-top: 6px solid var(--subject-color);
  border-radius: 16px;
  background: var(--paper-2);
  box-shadow: var(--shadow-soft);
}

.material-card h3 {
  margin: 0;
  font-family: var(--serif);
  font-size: 18px;
}

.material-meta {
  margin: 6px 0 14px;
  color: var(--muted);
  font-size: 10px;
}

.material-deadline {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 12px;
  padding: 6px 9px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--brick) 11%, var(--paper-2));
  color: var(--brick);
  font-family: var(--number);
  font-size: 10px;
  font-weight: 900;
}

.learning-extras {
  display: grid;
  grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr);
  gap: 14px;
  margin-top: 16px;
}

.feedback-card,
.score-card,
.heat-card,
.info-card {
  padding: 18px;
}

.feedback-card textarea {
  min-height: 190px;
}

.score-chart-wrap {
  margin-top: 14px;
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: color-mix(in srgb, var(--paper) 35%, var(--paper-2));
}

.score-chart {
  display: block;
  width: 100%;
  min-width: 520px;
  height: 250px;
}

.score-grid-line {
  stroke: color-mix(in srgb, var(--line) 72%, transparent);
  stroke-width: 1;
}

.score-axis-text {
  fill: var(--muted);
  font-family: var(--number);
  font-size: 10px;
}

.score-line {
  fill: none;
  stroke: var(--subject-color);
  stroke-width: 4;
  stroke-linejoin: round;
  stroke-linecap: round;
}

.score-dot {
  fill: var(--paper-2);
  stroke: var(--subject-color);
  stroke-width: 4;
}

.score-list {
  display: grid;
  gap: 6px;
  margin-top: 12px;
}

.score-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto auto;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-top: 1px dotted var(--line);
  font-size: 10px;
}

.score-value {
  font-size: 14px;
  font-weight: 900;
}

.heat-card {
  margin-bottom: 16px;
}

.heat-calendar {
  margin-top: 13px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--paper-2);
}

.heat-weekdays {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--paper-3) 60%, var(--paper-2));
}

.heat-weekdays span {
  padding: 8px 3px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 900;
  text-align: center;
}

.heat-day {
  min-height: 72px;
  padding: 7px;
  border: 0;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--paper-2);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}

.heat-day:nth-child(7n) {
  border-right: 0;
}

.heat-day.outside {
  opacity: .45;
}

.heat-day.today {
  box-shadow: inset 0 0 0 2px var(--brick);
}

.heat-day.level-1 { background: color-mix(in srgb, var(--forest) 13%, var(--paper-2)); }
.heat-day.level-2 { background: color-mix(in srgb, var(--forest) 25%, var(--paper-2)); }
.heat-day.level-3 { background: color-mix(in srgb, var(--forest) 42%, var(--paper-2)); }
.heat-day.level-4 { background: color-mix(in srgb, var(--forest) 62%, var(--paper-2)); }
.heat-day.level-5 { background: color-mix(in srgb, var(--forest) 82%, var(--paper-2)); color: #fff; }

.heat-date {
  display: block;
  font-family: var(--number);
  font-size: 11px;
  font-weight: 900;
}

.heat-minutes {
  display: block;
  margin-top: 18px;
  font-size: 9px;
  font-weight: 900;
}

.heat-legend {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 5px;
  margin-top: 9px;
  color: var(--muted);
  font-size: 9px;
}

.heat-legend i {
  width: 15px;
  height: 15px;
  border: 1px solid var(--line);
  border-radius: 4px;
}

.info-notice {
  margin-bottom: 16px;
  padding: 15px 17px;
  border: 1px solid color-mix(in srgb, var(--navy) 38%, var(--line));
  border-radius: 15px;
  background: color-mix(in srgb, var(--navy) 10%, var(--paper-2));
  color: var(--ink);
  font-size: 11px;
  line-height: 1.7;
}

.exam-schedule {
  display: grid;
  gap: 8px;
  margin-top: 14px;
}

.exam-row {
  display: grid;
  grid-template-columns: 58px minmax(110px, .7fr) minmax(130px, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: color-mix(in srgb, var(--paper) 30%, var(--paper-2));
  font-size: 11px;
}

.exam-row strong {
  font-family: var(--serif);
}

.exam-time {
  font-weight: 900;
}

.question-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 16px;
}

.question-card {
  padding: 16px;
  border: 1px solid var(--line);
  border-left: 6px solid var(--subject-color);
  border-radius: 14px;
  background: var(--paper-2);
  box-shadow: var(--shadow-soft);
}

.question-card h3 {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 18px;
}

.question-map {
  display: grid;
  gap: 6px;
}

.question-band {
  display: grid;
  grid-template-columns: 90px minmax(0, 1fr);
  gap: 9px;
  padding: 8px 9px;
  border-radius: 9px;
  background: color-mix(in srgb, var(--subject-color) 9%, var(--paper-2));
  font-size: 10px;
  line-height: 1.45;
}

.question-band strong {
  font-family: var(--number);
}

.source-list {
  display: grid;
  gap: 8px;
  margin-top: 16px;
}

.source-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--paper-2);
  color: var(--ink);
  font-size: 10px;
  font-weight: 800;
  text-decoration: none;
}

.source-link:hover {
  border-color: var(--forest);
  color: var(--forest);
}

.plan-detail-hero {
  padding: 15px;
  border: 1px solid var(--line);
  border-left: 6px solid var(--subject-color);
  border-radius: 14px;
  background: color-mix(in srgb, var(--subject-color) 8%, var(--paper-2));
}

.plan-detail-hero h3 {
  margin: 0 0 6px;
  font-family: var(--serif);
  font-size: 20px;
}

.plan-detail-hero p {
  margin: 0;
  color: var(--muted);
  font-size: 11px;
}

@media (max-width: 1260px) {
  .week-spread {
    grid-template-columns: repeat(4, minmax(155px, 1fr));
  }

  .day-card,
  .day-card.weekend {
    min-height: 300px;
  }
}

@media (max-width: 980px) {
  .daily-quote {
    grid-column: 1 / -1;
    margin: 0;
  }

  .learning-extras {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 760px) {
  .week-spread {
    grid-template-columns: 1fr;
  }

  .day-card,
  .day-card.weekend {
    min-height: 220px;
  }

  .material-grid,
  .question-grid {
    grid-template-columns: 1fr;
  }

  .month-simple-grid,
  .month-weekdays {
    min-width: 760px;
  }

  .heat-day {
    min-height: 59px;
    padding: 5px;
  }

  .heat-minutes {
    margin-top: 12px;
  }

  .exam-row {
    grid-template-columns: 45px minmax(90px, 1fr) auto;
  }

  .exam-row .exam-note {
    grid-column: 2 / -1;
  }

  .mobile-nav {
    grid-template-columns: repeat(5, 1fr);
  }
}

@media (max-width: 430px) {
  .heat-minutes {
    font-size: 8px;
  }

  .score-row {
    grid-template-columns: minmax(0, 1fr) auto auto;
  }

  .score-row .score-grade {
    display: none;
  }
}

/* 2026-07-28 feedback refinements */
body {
  font-size: 16px;
}

.main-content {
  width: 100%;
  max-width: 1320px;
  margin-inline: auto;
  justify-self: center;
}

.page-title-row {
  align-items: center;
}

.eyebrow,
.brand-copy span,
.rail-label {
  font-size: 11px;
}

.primary-btn,
.soft-btn,
.danger-btn,
.nav-btn,
.chip,
.form-group label {
  font-size: 13px;
}

.chart-subtitle,
.page-subtitle {
  display: none;
}

.brand-paw {
  display: inline-grid;
  width: 32px;
  height: 32px;
  place-items: center;
  margin-left: 2px;
  border: 1px solid color-mix(in srgb, var(--brick) 48%, var(--line));
  border-radius: 50%;
  background: color-mix(in srgb, var(--brick) 10%, var(--paper-2));
  transform: rotate(-8deg);
}

.brand-paw svg {
  width: 21px;
  height: 21px;
  fill: var(--brick);
  filter: drop-shadow(.4px .6px 0 color-mix(in srgb, var(--brick) 22%, transparent));
}

.exam-countdown-card {
  position: relative;
  margin: 0 0 14px 10px;
  overflow: visible;
  border: 1px solid color-mix(in srgb, var(--brick) 55%, var(--line));
  border-radius: 18px;
  background: var(--paper-2);
  box-shadow: var(--shadow-soft);
}

.exam-countdown-card::after {
  content: "🐈";
  position: absolute;
  top: -17px;
  right: 12px;
  font-size: 25px;
  filter: saturate(.72);
  transform: rotate(4deg);
  pointer-events: none;
}

.exam-countdown-main {
  display: grid;
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 17px 17px 0 0;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--brick) 15%, var(--paper-2)), var(--paper-2));
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}

.exam-countdown-label {
  color: var(--brick);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .12em;
}

.exam-countdown-main strong {
  margin-top: 4px;
  color: var(--brick);
  font-family: var(--number);
  font-size: 34px;
  font-variant-numeric: tabular-nums lining-nums;
  line-height: 1;
}

.exam-countdown-main small {
  margin-top: 8px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  line-height: 1.45;
}

.daily-quote {
  margin: 0;
  padding: 13px 15px 15px;
  border: 0;
  border-top: 1px dashed color-mix(in srgb, var(--mustard) 52%, var(--line));
  border-radius: 0 0 17px 17px;
  box-shadow: none;
}

.daily-quote .quote-label {
  font-size: 10px;
}

.daily-quote p {
  font-size: 14px;
}

.mini-calendar,
.dday-panel {
  margin-bottom: 14px;
}

.calendar-title,
.panel-head h2 {
  font-size: 17px;
}

.dday-ticket strong {
  font-size: 13px;
}

.dday-ticket span,
.dday-ticket small,
.empty-rail {
  font-size: 11px;
}

.page-title {
  font-size: clamp(32px, 3.2vw, 47px);
}

.month-page-title {
  font-family: var(--number);
  font-weight: 900;
  letter-spacing: -.025em;
  font-variant-numeric: tabular-nums lining-nums;
}

.day-card-head {
  align-items: center;
}

.day-number {
  font-family: var(--number);
  font-size: 32px;
  font-weight: 900;
}

.day-card.today .day-number {
  display: inline-grid;
  width: 43px;
  height: 43px;
  margin: -5px 0 -5px -5px;
  place-items: center;
  border: 2px solid var(--forest);
  border-radius: 50%;
  background: color-mix(in srgb, var(--forest) 9%, var(--paper-2));
}

.day-state {
  display: inline-grid;
  width: 24px;
  height: 24px;
  margin-left: auto;
  place-items: center;
  border-radius: 50%;
  font-family: var(--number);
  font-size: 14px;
  font-weight: 900;
}

.day-state.past {
  background: color-mix(in srgb, var(--forest) 14%, var(--paper-2));
  color: var(--forest);
}

.day-name {
  margin-left: 7px;
  font-size: 12px;
}

.plan-slip {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  min-height: 82px;
  padding: 10px 9px 10px 13px;
  cursor: default;
}

.plan-slip-main {
  min-width: 0;
  padding: 3px 0;
  border: 0;
  background: transparent;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}

.plan-slip-main strong {
  display: block;
  overflow: hidden;
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 800;
  line-height: 1.4;
  white-space: normal;
  text-overflow: initial;
}

.plan-slip .target-pages {
  margin-top: 7px;
  color: var(--task-color);
  font-size: 14px;
  font-weight: 900;
}

.plan-check {
  display: inline-grid;
  width: 32px;
  height: 32px;
  place-items: center;
  border: 2px solid var(--task-color);
  border-radius: 9px;
  background: var(--paper-2);
  color: #fff;
  font-family: var(--number);
  font-size: 18px;
  font-weight: 900;
  cursor: pointer;
}

.plan-check[aria-pressed="true"] {
  background: var(--task-color);
}

.plan-slip.checked {
  opacity: .66;
}

.plan-slip.checked .plan-slip-main strong {
  text-decoration: line-through;
}

.completion-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 16px;
  border: 1px solid color-mix(in srgb, var(--forest) 32%, var(--line));
  border-radius: 14px;
  background: color-mix(in srgb, var(--forest) 9%, var(--paper-2));
}

.completion-summary strong {
  font-family: var(--serif);
  font-size: 19px;
}

.completion-summary span {
  flex: 0 0 auto;
  color: var(--forest);
  font-family: var(--number);
  font-size: 16px;
  font-weight: 900;
}

.weekly-bottom {
  grid-template-columns: minmax(320px, 1fr) minmax(280px, .78fr);
  max-width: 1040px;
}

.feedback-book {
  display: block;
}

.feedback-page h3,
.deadline-list h3,
.section-head h2,
.chart-title {
  font-size: 20px;
}

  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
  text-align: left;
  vertical-align: top;

.month-simple-head {
  width: 100%;
  align-items: flex-start;

.month-simple-head strong {
  justify-self: start;
  font-size: 14px;
}

.month-event {
  font-size: 11px;
}

.heat-card {
  max-width: 1100px;

.study-subject-filter {

  gap: 7px;
  margin-top: 14px;

.study-subject-filter button {

  align-items: center;
  gap: 6px;
  flex: 0 0 auto;

  border: 1px solid color-mix(in srgb, var(--subject-color, var(--forest)) 42%, var(--line));

  font-size: 12px;
  font-weight: 900;
  cursor: pointer;

.study-subject-filter button.active {

.filter-check {
  display: inline-grid;
  width: 17px;
  height: 17px;

  border: 1px solid currentColor;

  font-size: 11px;
}

.heat-day {

  font-size: 15px;

.heat-minutes {

  font-size: 11px;
  text-align: right;
}

.heat-weekdays span,
.heat-legend {
  font-size: 11px;
}

.stat-card span,
.bar-label,
.subject-summary-row,
.log-row {
  font-size: 12px;
}

.info-notice,
.schedule-card {
  width: min(860px, 100%);
  margin-inline: auto;
}

.info-notice {
  font-size: 13px;
}

.exam-schedule {
  gap: 7px;
}

.exam-row {
  grid-template-columns: 70px 180px 150px minmax(0, 1fr);
  gap: 12px;
  font-size: 13px;
}

.exam-row > * {
  min-width: 0;
}

.exam-row-head {
  border-color: var(--forest);
  background: var(--forest);
  color: var(--paper-2);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .05em;
}

.question-grid {
  grid-template-columns: repeat(auto-fit, minmax(255px, 1fr));
  width: min(1000px, 100%);
  margin-inline: auto;
}

.question-card h3 {
  font-size: 19px;
}

.question-band {
  grid-template-columns: 82px minmax(0, 1fr);
  font-size: 12px;
}

.material-grid {
  grid-template-columns: repeat(auto-fit, minmax(300px, 410px));
  justify-content: start;
}

.material-card {
  border-top-color: var(--category-color);
}

.material-meta,
.material-deadline,
.progress-head,
.score-row {
  font-size: 12px;
}

.category-chip {
  border: 1px solid color-mix(in srgb, var(--category-color) 55%, var(--line));
  background: color-mix(in srgb, var(--category-color) 10%, var(--paper-2));
  color: var(--category-color);
}

.category-chip.active {
  border-color: var(--category-color);
  background: var(--category-color);
  color: #fff;
}

.category-row > span {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.category-color-dot {
  width: 12px;
  height: 12px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--category-color);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--category-color) 16%, transparent);
}

.learning-overview,
.learning-toolbar,
.learning-extras {
  max-width: 1120px;
}

.subject-tabs-standalone {
  width: min(1120px, 100%);
  margin-bottom: 18px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: color-mix(in srgb, var(--paper-2) 92%, var(--forest-soft));
  box-shadow: var(--shadow-soft);
}

.subject-tabs-standalone .subject-tab {
  min-height: 76px;
  padding: 17px 13px 13px;
  border-radius: 13px;
  cursor: pointer;
}

.subject-tabs-standalone .subject-tab strong {
  font-size: 14px;
}

.subject-tabs-standalone .subject-tab span {
  font-size: 11px;
}

.learning-extras.score-only {
  display: block;
  width: min(840px, 100%);
}

.learning-extras.score-only .score-card {
  width: 100%;
}

@media (max-width: 980px) {
  .common-panel {
    display: block;
  }

  .common-inner {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }

  .exam-countdown-card,
  .mini-calendar,
  .dday-panel {
    height: auto;
    margin: 0;
  }

}

@media (max-width: 760px) {
  .brand-paw {
    display: none;
  }

  .common-inner {
    grid-template-columns: 1fr;
  }

  .page-title {
    font-size: 34px;
  }

  .day-card,
  .day-card.weekend {
    min-height: 205px;
  }

  .weekly-bottom,
  .material-grid {
    grid-template-columns: 1fr;
  }

  .heat-day {
    min-height: 82px;
    aspect-ratio: auto;
  }

  .heat-date {
    font-size: 13px;
  }

  .heat-minutes {
    font-size: 10px;
  }

  .exam-row {
    grid-template-columns: 54px minmax(0, 1fr);
    gap: 6px 10px;
  }

  .exam-row-head {
    display: none;
  }

  .exam-time,
  .exam-note {
    grid-column: 2;
  }

  .exam-note {
    color: var(--muted);
  }

  .question-grid {
    grid-template-columns: 1fr;
  }
}

/* 2026-07-28 typography, palette, weekly density and cat sketches */
:root {
  --ui-font: "Pretendard Variable", "Pretendard", "SUIT Variable", "SUIT", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --serif: var(--ui-font);
  --sans: var(--ui-font);
  --number: var(--ui-font);
  --paper: #fbf9fc;
  --paper-2: #ffffff;
  --paper-3: #f2eef5;
  --ink: #34313b;
  --muted: #746d7b;
  --line: #e7e0e9;
  --line-strong: #cfc3d2;
  --forest: #7598bd;
  --forest-soft: #edf5fb;
  --navy: #9197c7;
  --brick: #df8d95;
  --mustard: #ddb36e;
  --lavender: #aa99c8;
  --pencil-red: #dc7f87;
  --pencil-blue: #7297c1;
  --shadow: 0 16px 40px rgba(92, 79, 106, .09);
  --shadow-soft: 0 7px 20px rgba(92, 79, 106, .07);
}

html.dark {
  --paper: #1d1d24;
  --paper-2: #292831;
  --paper-3: #373541;
  --ink: #f4f1f5;
  --muted: #c0b9c6;
  --line: #504b59;
  --line-strong: #777080;
  --forest: #abc7e2;
  --forest-soft: #344454;
  --navy: #b8bce2;
  --brick: #efaab0;
  --mustard: #ebca91;
  --lavender: #cbbce0;
  --pencil-red: #e99b9e;
  --pencil-blue: #aec9e5;
}

html,
body,
button,
input,
select,
textarea {
  font-family: var(--ui-font);
}

body {
  background:
    radial-gradient(circle at 8% 4%, rgba(218, 232, 248, .66), transparent 29rem),
    radial-gradient(circle at 92% 20%, rgba(249, 222, 230, .55), transparent 27rem),
    radial-gradient(circle at 52% 94%, rgba(232, 224, 247, .55), transparent 30rem),
    repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(88, 74, 100, .012) 4px),
    var(--paper);
}

.app-frame {
  background: color-mix(in srgb, var(--paper-2) 82%, var(--paper));
}

.exam-countdown-card::after {
  content: none;
}

.page-title,
.brand-copy strong,
.calendar-title,
.panel-head h2,
.section-head h2,
.chart-title,
.feedback-page h3,
.material-card h3,
.question-card h3,
.plan-slip-main strong,
.completion-summary strong {
  font-family: var(--ui-font);
  letter-spacing: -.025em;
}

.page-title,
.brand-copy strong,
.section-head h2,
.chart-title,
.feedback-page h3 {
  font-weight: 700;
}

.month-page-title,
.calendar-title,
.week-stamp,
.month-simple-head strong,
.mini-day,
.heat-date,
.heat-minutes,
.day-number,
.exam-time,
.num {
  font-family: var(--ui-font);
  font-variant-numeric: tabular-nums lining-nums;
}

.month-page-title {
  font-weight: 500;
  letter-spacing: -.035em;
}

.week-stamp,
.calendar-title,
.mini-day,
.heat-date {
  font-weight: 600;
}

.month-simple-head strong {
  font-weight: 500;
}

.week-spread {
  grid-template-columns: repeat(4, minmax(225px, 1fr));
  gap: 16px;
}

.day-card,
.day-card.weekend {
  min-height: 318px;
  padding: 18px 16px 18px 28px;
}

.day-card-head {
  justify-content: flex-start;
  min-height: 44px;
}

.day-number {
  position: relative;
  display: inline-block;
  min-width: 42px;
  color: var(--ink);
  font-size: 30px;
  font-weight: 600;
  line-height: 1.1;
  text-align: center;
  isolation: isolate;
}

.day-card.today .day-number {
  display: inline-block;
  width: auto;
  height: auto;
  margin: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}

.day-number.pencil-circled::before,
.day-number.pencil-circled::after {
  content: "";
  position: absolute;
  pointer-events: none;
}

.day-number.pencil-circled::before {
  inset: -7px -9px -6px;
  z-index: -1;
  border: 3px solid var(--pencil-red);
  border-radius: 51% 46% 53% 48%;
  opacity: .78;
  filter: drop-shadow(.8px .5px 0 color-mix(in srgb, var(--pencil-red) 35%, transparent));
  transform: rotate(-8deg);
}

.day-number.pencil-circled::after {
  inset: -5px -7px -7px -8px;
  z-index: -1;
  border: 1px solid color-mix(in srgb, var(--pencil-red) 70%, transparent);
  border-radius: 47% 54% 48% 52%;
  opacity: .7;
  transform: rotate(7deg);
}

.day-number.pencil-checked::after {
  content: "✓";
  position: absolute;
  top: -17px;
  left: -6px;
  z-index: 2;
  color: var(--pencil-blue);
  font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", var(--ui-font);
  font-size: 47px;
  font-weight: 500;
  line-height: 1;
  opacity: .82;
  text-shadow:
    .7px .7px 0 color-mix(in srgb, var(--pencil-blue) 42%, transparent),
    -.5px .3px 0 color-mix(in srgb, var(--pencil-blue) 26%, transparent);
  transform: rotate(-9deg) scaleX(.94);
  pointer-events: none;
}

.day-state {
  display: none;
}

.day-name {
  margin-left: auto;
  font-size: 12px;
  letter-spacing: .04em;
}

.day-study-time {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 2px 0 11px;
  padding: 8px 2px 9px;
  border-bottom: 1px dashed color-mix(in srgb, var(--pencil-blue) 46%, var(--line));
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
}

.day-study-time strong {
  color: var(--pencil-blue);
  font-family: var(--ui-font);
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums lining-nums;
}

.day-task-list {
  gap: 6px;
}

.plan-slip {
  min-height: 58px;
  gap: 6px;
  padding: 7px 8px 7px 10px;
  border-left-width: 3px;
  border-radius: 10px;
}

.plan-slip-main strong {
  font-size: 14px;
  font-weight: 700;
  line-height: 1.32;
}

.plan-slip .target-pages {
  margin-top: 4px;
  font-size: 12px;
  font-weight: 700;
}

.plan-check {
  width: 24px;
  height: 24px;
  border-width: 1.5px;
  border-radius: 7px;
  font-size: 14px;
}

.week-controls {
  display: grid;
  grid-template-columns: 42px minmax(250px, auto) 42px;
  justify-content: start;
  width: max-content;
  max-width: 100%;
}

.weekly-bottom {
  display: block;
  width: min(720px, 100%);
  max-width: 720px;
}

.feedback-book {
  min-height: 220px;
}

.deadline-list,
.week-progress {
  display: none;
}

.page-canvas {
  position: relative;
  min-height: calc(100vh - 150px);
  isolation: isolate;
}

.page-canvas > :not(.cat-photo-layer) {
  position: relative;
  z-index: 1;
}

.cat-photo-layer {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

      id: subject.id,
      name: subject.name,
      color: subject.color,
      categories: subject.categories.map(([id, name]) => ({
        id,
        name,
        updatedAt: SEED_STAMP,
      })),
    }));
  }

  function createDefaultState() {
    const now = new Date().toISOString();
    return {
      version: 2,
      subjects: makeSubjects(),
      tasks: [],
      ddays: [],
      weeklyNotes: {},
      tombstones: { tasks: {}, ddays: {}, categories: {} },
      createdAt: now,
      updatedAt: now,
    };
  }

  function normalizeLog(log) {
    const timestamp = (log && (log.updatedAt || log.createdAt)) || new Date().toISOString();
    return {
      id: log && log.id ? String(log.id) : newId("log"),
      date: toDateKey(log && log.date) || toDateKey(new Date()),
      minutes: Math.max(0, Math.round(Number(log && log.minutes) || 0)),
      createdAt: (log && log.createdAt) || timestamp,
      updatedAt: timestamp,
    };
  }

  function normalizeTask(task, subjects) {
    const subject = subjects.find((item) => item.id === task.subjectId) || subjects[0];
    const category = subject.categories.find((item) => item.id === task.categoryId) || subject.categories[0];
    const range = normalizedRange(task.startDate, task.deadline);
    const totalPages = Math.max(0, Math.round(Number(task.totalPages) || 0));
    const completedPages = clamp(Math.round(Number(task.completedPages) || 0), 0, totalPages || 999999);
    const fallbackStamp = task.updatedAt || task.createdAt || new Date().toISOString();
    return {
      id: task.id ? String(task.id) : newId("task"),
      subjectId: subject.id,
      categoryId: category ? category.id : "",
      title: String(task.title || "").trim(),
      material: String(task.material || "").trim(),
      startDate: range.start || toDateKey(new Date()),
      deadline: range.end || range.start || toDateKey(new Date()),
      totalPages,
      completedPages,
      completed: Boolean(task.completed),
      teacherChecked: Boolean(task.teacherChecked),
      feedback: String(task.feedback || ""),
      studentNote: String(task.studentNote || ""),
      studyLogs: Array.isArray(task.studyLogs) ? task.studyLogs.map(normalizeLog).filter((log) => log.minutes > 0) : [],
      studyLogTombstones: { ...(task.studyLogTombstones || {}) },
      planUpdatedAt: task.planUpdatedAt || fallbackStamp,
      completionUpdatedAt: task.completionUpdatedAt || fallbackStamp,
      pagesUpdatedAt: task.pagesUpdatedAt || fallbackStamp,
      reviewUpdatedAt: task.reviewUpdatedAt || fallbackStamp,
      feedbackUpdatedAt: task.feedbackUpdatedAt || fallbackStamp,
      studentNoteUpdatedAt: task.studentNoteUpdatedAt || fallbackStamp,
      createdAt: task.createdAt || fallbackStamp,
      updatedAt: fallbackStamp,
    };
  }

  function normalizeState(raw) {
    const fallback = createDefaultState();
    if (!raw || typeof raw !== "object") return fallback;
    const subjects = Array.isArray(raw.subjects) && raw.subjects.length
      ? raw.subjects.map((subject, index) => ({
          id: String(subject.id || SUBJECT_SEED[index]?.id || newId("subject")),
          name: String(subject.name || SUBJECT_SEED[index]?.name || "과목"),
          color: String(subject.color || SUBJECT_SEED[index]?.color || "#315F55"),
          categories: Array.isArray(subject.categories) && subject.categories.length
            ? subject.categories.map((category) => ({
                id: String((category && category.id) || newId("cat")),
                name: String((category && category.name) || category || "기타"),
                updatedAt: (category && category.updatedAt) || SEED_STAMP,
              }))
            : [{ id: newId("cat"), name: "기타", updatedAt: new Date().toISOString() }],
        }))
      : fallback.subjects;

    const tasks = Array.isArray(raw.tasks)
      ? raw.tasks.map((task) => normalizeTask(task || {}, subjects)).filter((task) => task.title)
      : [];

    const ddays = Array.isArray(raw.ddays)
      ? raw.ddays.map((item) => {
          const range = normalizedRange(item.startDate || item.date, item.endDate || item.date);
          return {
            id: item.id ? String(item.id) : newId("dday"),
            title: String(item.title || "").trim(),
            startDate: range.start,
            endDate: range.end,
            color: String(item.color || "#A6493C"),
            createdAt: item.createdAt || new Date().toISOString(),
            updatedAt: item.updatedAt || new Date().toISOString(),
          };
        }).filter((item) => item.title && item.startDate)
      : [];

    const weeklyNotes = raw.weeklyNotes && typeof raw.weeklyNotes === "object"
      ? Object.fromEntries(Object.entries(raw.weeklyNotes).map(([key, value]) => [
          key,
          {
            student: String((value && value.student) || ""),
            teacher: String((value && value.teacher) || ""),
            studentUpdatedAt: (value && (value.studentUpdatedAt || value.updatedAt)) || "",
            teacherUpdatedAt: (value && (value.teacherUpdatedAt || value.updatedAt)) || "",
            updatedAt: (value && value.updatedAt) || "",
          },
        ]))
      : {};

    return {
      version: 2,
      subjects,
      tasks,
      ddays,
      weeklyNotes,
      tombstones: {
        tasks: { ...((raw.tombstones && raw.tombstones.tasks) || {}) },
        ddays: { ...((raw.tombstones && raw.tombstones.ddays) || {}) },
        categories: { ...((raw.tombstones && raw.tombstones.categories) || {}) },
      },
      createdAt: raw.createdAt || fallback.createdAt,
      updatedAt: raw.updatedAt || fallback.updatedAt,
    };
  }

  function newerRecord(left, right) {
    if (!left) return right;
    if (!right) return left;
    return String(left.updatedAt || "") >= String(right.updatedAt || "") ? left : right;
  }

  function mergeRecordList(leftList, rightList, tombstones) {
    const byId = new Map();
    [...(leftList || []), ...(rightList || [])].forEach((item) => {
      if (!item || !item.id) return;
      byId.set(item.id, newerRecord(byId.get(item.id), item));
    });
    return Array.from(byId.values()).filter((item) => {
      const deletedAt = tombstones && tombstones[item.id];
      return !deletedAt || String(item.updatedAt || "") > String(deletedAt);
    });
  }

  function latestStamp(record, key) {
    return String((record && (record[key] || record.updatedAt || record.createdAt)) || "");
  }

  function copyNewerGroup(target, left, right, stampKey, fields) {
    const source = latestStamp(left, stampKey) >= latestStamp(right, stampKey) ? left : right;
    fields.forEach((field) => {
      target[field] = source[field];
    });
    target[stampKey] = source[stampKey] || source.updatedAt || source.createdAt || "";
  }

  function mergeTask(left, right) {
    if (!left) return right;
    if (!right) return left;
    const base = { ...newerRecord(left, right) };
    copyNewerGroup(base, left, right, "planUpdatedAt", [
      "subjectId", "categoryId", "title", "material", "startDate", "deadline", "totalPages",
    ]);
    copyNewerGroup(base, left, right, "completionUpdatedAt", ["completed"]);
    copyNewerGroup(base, left, right, "pagesUpdatedAt", ["completedPages"]);
    copyNewerGroup(base, left, right, "reviewUpdatedAt", ["teacherChecked"]);
    copyNewerGroup(base, left, right, "feedbackUpdatedAt", ["feedback"]);
    copyNewerGroup(base, left, right, "studentNoteUpdatedAt", ["studentNote"]);

    const studyLogTombstones = { ...right.studyLogTombstones, ...left.studyLogTombstones };
    const tombstoneIds = new Set([
      ...Object.keys(left.studyLogTombstones || {}),
      ...Object.keys(right.studyLogTombstones || {}),
    ]);
    tombstoneIds.forEach((id) => {
      studyLogTombstones[id] = String((left.studyLogTombstones || {})[id] || "") >= String((right.studyLogTombstones || {})[id] || "")
        ? left.studyLogTombstones[id]
        : right.studyLogTombstones[id];
    });
    base.studyLogTombstones = studyLogTombstones;
    base.studyLogs = mergeRecordList(left.studyLogs, right.studyLogs, studyLogTombstones);
    base.createdAt = String(left.createdAt || "") <= String(right.createdAt || "") ? left.createdAt : right.createdAt;
    base.updatedAt = String(left.updatedAt || "") >= String(right.updatedAt || "") ? left.updatedAt : right.updatedAt;
    return base;
  }

  function mergeTaskList(leftList, rightList, tombstones) {
    const byId = new Map();
    [...(leftList || []), ...(rightList || [])].forEach((task) => {
      if (!task || !task.id) return;
      byId.set(task.id, mergeTask(byId.get(task.id), task));
    });
    return Array.from(byId.values()).filter((task) => {
      const deletedAt = tombstones && tombstones[task.id];
      return !deletedAt || String(task.updatedAt || "") > String(deletedAt);
    });
  }

  function mergeWeeklyNote(left, right) {
    if (!left) return right;
    if (!right) return left;
    const studentSource = latestStamp(left, "studentUpdatedAt") >= latestStamp(right, "studentUpdatedAt") ? left : right;
    const teacherSource = latestStamp(left, "teacherUpdatedAt") >= latestStamp(right, "teacherUpdatedAt") ? left : right;
    return {
      student: studentSource.student,
      teacher: teacherSource.teacher,
      studentUpdatedAt: studentSource.studentUpdatedAt || studentSource.updatedAt || "",
      teacherUpdatedAt: teacherSource.teacherUpdatedAt || teacherSource.updatedAt || "",
      updatedAt: String(left.updatedAt || "") >= String(right.updatedAt || "") ? left.updatedAt : right.updatedAt,
    };
  }

  function mergeStates(localRaw, remoteRaw) {
    if (!remoteRaw || typeof remoteRaw !== "object") return normalizeState(localRaw);
    if (!localRaw || typeof localRaw !== "object") return normalizeState(remoteRaw);
    const local = normalizeState(localRaw);
    const remote = normalizeState(remoteRaw);
    const tombstones = {
      tasks: { ...remote.tombstones.tasks, ...local.tombstones.tasks },
      ddays: { ...remote.tombstones.ddays, ...local.tombstones.ddays },
      categories: { ...remote.tombstones.categories, ...local.tombstones.categories },
    };
    ["tasks", "ddays", "categories"].forEach((kind) => {
      const localValues = local.tombstones[kind] || {};
      const remoteValues = remote.tombstones[kind] || {};
      const ids = new Set([...Object.keys(localValues), ...Object.keys(remoteValues)]);
      ids.forEach((id) => {
        tombstones[kind][id] = String(localValues[id] || "") >= String(remoteValues[id] || "")
          ? localValues[id]
          : remoteValues[id];
      });
    });

    const subjects = SUBJECT_SEED.map((seed, index) => {
      const localSubject = local.subjects.find((item) => item.id === seed.id) || local.subjects[index];
      const remoteSubject = remote.subjects.find((item) => item.id === seed.id) || remote.subjects[index];
      const base = remoteSubject || localSubject || makeSubjects()[index];
      const categories = mergeRecordList(
        (localSubject && localSubject.categories) || [],
        (remoteSubject && remoteSubject.categories) || [],
        tombstones.categories
      );
      return { ...base, categories: categories.length ? categories : makeSubjects()[index].categories };
    });

    const weeklyNotes = {};
    const noteKeys = new Set([...Object.keys(local.weeklyNotes), ...Object.keys(remote.weeklyNotes)]);
    noteKeys.forEach((key) => {
      weeklyNotes[key] = mergeWeeklyNote(local.weeklyNotes[key], remote.weeklyNotes[key]);
    });

    return normalizeState({
      version: 2,
      subjects,
      tasks: mergeTaskList(local.tasks, remote.tasks, tombstones.tasks),
      ddays: mergeRecordList(local.ddays, remote.ddays, tombstones.ddays),
      weeklyNotes,
      tombstones,
      createdAt: String(local.createdAt || "") <= String(remote.createdAt || "") ? local.createdAt : remote.createdAt,
      updatedAt: String(local.updatedAt || "") >= String(remote.updatedAt || "") ? local.updatedAt : remote.updatedAt,
    });
  }

  function taskProgress(task) {
    if (task.completed) return 100;
    if (Number(task.totalPages) > 0) {
      return clamp(Math.round((Number(task.completedPages || 0) / Number(task.totalPages)) * 100), 0, 100);
    }
    return 0;
  }

  function progressForTasks(tasks) {
    if (!tasks.length) return 0;
    let doneUnits = 0;
    let totalUnits = 0;
    tasks.forEach((task) => {
      if (Number(task.totalPages) > 0) {
        totalUnits += Number(task.totalPages);
        doneUnits += task.completed
          ? Number(task.totalPages)
          : clamp(Number(task.completedPages || 0), 0, Number(task.totalPages));
      } else {
        totalUnits += 1;
        doneUnits += task.completed ? 1 : 0;
      }
    });
    return totalUnits ? Math.round((doneUnits / totalUnits) * 100) : 0;
  }

  function subjectProgress(state, subjectId) {
    return progressForTasks(state.tasks.filter((task) => task.subjectId === subjectId));
  }

  function overallProgress(state) {
    return progressForTasks(state.tasks);
  }

  function tasksForDate(state, dateKey) {
    return state.tasks
      .filter((task) => rangeContains(task.startDate, task.deadline, dateKey))
      .sort((a, b) => Number(a.completed) - Number(b.completed) || a.deadline.localeCompare(b.deadline) || a.title.localeCompare(b.title));
  }

  function tasksForWeek(state, dateValue) {
    const start = toDateKey(startOfWeek(dateValue));
    const end = toDateKey(endOfWeek(dateValue));
    return state.tasks.filter((task) => rangeIntersects(task.startDate, task.deadline, start, end));
  }

  function formatMinutes(totalMinutes) {
    const minutes = Math.max(0, Math.round(Number(totalMinutes) || 0));
    const hours = Math.floor(minutes / 60);
    const rest = minutes % 60;
    if (!hours) return `${rest}분`;
    if (!rest) return `${hours}시간`;
    return `${hours}시간 ${rest}분`;
  }

  function minutesByDateAndSubject(state, startDate, endDate) {
    const result = {};
    state.tasks.forEach((task) => {
      task.studyLogs.forEach((log) => {
        if (log.date < startDate || log.date > endDate) return;
        if (!result[log.date]) result[log.date] = {};
        result[log.date][task.subjectId] = (result[log.date][task.subjectId] || 0) + log.minutes;
      });
    });
    return result;
  }

  function weekStudySummary(state, dateValue) {
    const startDate = toDateKey(startOfWeek(dateValue));
    const endDate = toDateKey(endOfWeek(dateValue));
    const byDate = minutesByDateAndSubject(state, startDate, endDate);
    const bySubject = {};
    let total = 0;
    Object.values(byDate).forEach((subjectMap) => {
      Object.entries(subjectMap).forEach(([subjectId, minutes]) => {
        bySubject[subjectId] = (bySubject[subjectId] || 0) + minutes;
        total += minutes;
      });
    });
    return { startDate, endDate, byDate, bySubject, total };
  }

  function ddayLabel(item, todayValue) {
    const today = toDateKey(todayValue || new Date());
    const range = normalizedRange(item.startDate, item.endDate);
    if (!range.start) return "";
    if (today < range.start) return `D-${Math.abs(dateDiff(range.start, today))}`;
    if (today > range.end) return `D+${Math.abs(dateDiff(today, range.end))}`;
    if (range.start === range.end) return "D-DAY";
    const remaining = dateDiff(range.end, today);
    return remaining === 0 ? "오늘 마감" : `진행 중 · ${remaining}일`;
  }

  function monthGrid(year, monthIndex) {
    const first = new Date(year, monthIndex, 1);
    const mondayOffset = (first.getDay() + 6) % 7;
    const gridStart = addDays(first, -mondayOffset);
    return Array.from({ length: 42 }, (_, index) => addDays(gridStart, index));
  }

  function ganttSegments(items, gridDates, maxLanes) {
    const limit = Number(maxLanes || 4);
    const weeks = Array.from({ length: 6 }, (_, index) => gridDates.slice(index * 7, index * 7 + 7));
    return weeks.map((days, weekIndex) => {
      const weekStart = toDateKey(days[0]);
      const weekEnd = toDateKey(days[6]);
      const segments = items
        .filter((item) => rangeIntersects(item.startDate, item.endDate, weekStart, weekEnd))
        .map((item) => {
          const range = normalizedRange(item.startDate, item.endDate);
          const segmentStart = range.start < weekStart ? weekStart : range.start;
          const segmentEnd = range.end > weekEnd ? weekEnd : range.end;
          return {
            ...item,
            colStart: dateDiff(segmentStart, weekStart) + 1,
            colEnd: dateDiff(segmentEnd, weekStart) + 2,
            continuesBefore: range.start < weekStart,
            continuesAfter: range.end > weekEnd,
          };
        })
        .sort((a, b) => a.colStart - b.colStart || (b.colEnd - b.colStart) - (a.colEnd - a.colStart));

      const laneEnds = [];
      segments.forEach((segment) => {
        let lane = laneEnds.findIndex((endColumn) => segment.colStart >= endColumn);
        if (lane === -1) lane = laneEnds.length;
        laneEnds[lane] = segment.colEnd;
        segment.lane = lane;
      });

      return {
        weekIndex,
        segments: segments.filter((segment) => segment.lane < limit),
        hiddenCount: segments.filter((segment) => segment.lane >= limit).length,
      };
    });
  }

  return {
    SUBJECT_SEED,
    newId,
    toDateKey,
    parseDateKey,
    addDays,
    startOfWeek,
    endOfWeek,
    weekKey,
    dateDiff,
    clamp,
    normalizedRange,
    rangeIntersects,
    rangeContains,
    createDefaultState,
    normalizeState,
    mergeStates,
    taskProgress,
    progressForTasks,
    subjectProgress,
    overallProgress,
    tasksForDate,
    tasksForWeek,
    formatMinutes,
    minutesByDateAndSubject,
    weekStudySummary,
    ddayLabel,
    monthGrid,
    ganttSegments,
  };
});

  <script>
if (false) (function () {
  "use strict";

  const C = window.StudyCore;
  const STORAGE_KEY = "study_coach_state_v1";
  const CLOUD_KEY = "study_coach_cloud_v1";
  const THEME_KEY = "study_coach_theme";
  const WEEKDAYS = ["월", "화", "수", "목", "금", "토", "일"];
  const WEEKDAYS_LONG = ["월요일", "화요일", "수요일", "목요일", "금요일", "토요일", "일요일"];
  const DDAY_COLORS = ["#A6493C", "#315F55", "#44658F", "#B27A36", "#788A4E"];

  const app = document.getElementById("app");
  const modalRoot = document.getElementById("modalRoot");
  const toastEl = document.getElementById("toast");

  let state = loadLocalState();
  let cloud = loadCloudConfig();
  let cloudCanPush = false;
  let cloudPushTimer = null;
  let cloudPushRunning = false;
  let toastTimer = null;

  let todayKey = C.toDateKey(new Date());
  const initialSubject = state.subjects[0] ? state.subjects[0].id : "kor";
  const ui = {
    page: "weekly",
    selectedDate: todayKey,
    miniMonth: `${todayKey.slice(0, 7)}-01`,
    monthDate: `${todayKey.slice(0, 7)}-01`,
    studyWeek: C.weekKey(todayKey),
    selectedSubject: initialSubject,
    selectedCategory: "all",
    learningFilter: "active",
    expandedTaskId: "",
    commonCollapsed: true,
  };

  applyIncomingBin();
  applyTheme(localStorage.getItem(THEME_KEY) || "light");
  render();
  if (cloud.binId && cloud.key) pullCloud({ silent: true });
  scheduleTodayRefresh();

  function loadLocalState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return C.normalizeState(raw ? JSON.parse(raw) : null);
    } catch (_) {
      return C.createDefaultState();
    }
  }

  function loadCloudConfig() {
    try {
      const parsed = JSON.parse(localStorage.getItem(CLOUD_KEY) || "{}");
      return {
        binId: String(parsed.binId || ""),
        key: String(parsed.key || ""),
        keyType: parsed.keyType === "master" ? "master" : "access",
        status: parsed.binId && parsed.key ? "연결 준비" : "로컬 저장",
        lastSync: String(parsed.lastSync || ""),
        pending: false,
      };
    } catch (_) {
      return { binId: "", key: "", keyType: "access", status: "로컬 저장", lastSync: "", pending: false };
    }
  }

  function saveCloudConfig() {
    localStorage.setItem(CLOUD_KEY, JSON.stringify({
      binId: cloud.binId,
      key: cloud.key,
      keyType: cloud.keyType,
      lastSync: cloud.lastSync,
    }));
  }

  function applyIncomingBin() {
    if (!location.hash.startsWith("#")) return;
    const params = new URLSearchParams(location.hash.slice(1));
    const binId = params.get("bin");
    if (binId) {
      cloud.binId = binId.trim();
      cloud.status = cloud.key ? "연결 준비" : "동기화 키 필요";
      saveCloudConfig();
      history.replaceState(null, "", location.pathname + location.search);
    }
  }

  function nowIso() {
    return new Date().toISOString();
  }

  function scheduleTodayRefresh() {
    const now = new Date();
    const next = new Date(now);
    next.setHours(24, 0, 2, 0);
    setTimeout(() => {
      const nextToday = C.toDateKey(new Date());
      if (nextToday !== todayKey) {
        todayKey = nextToday;
        render();
      }
      scheduleTodayRefresh();
    }, Math.max(1000, next - now));
  }

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function showToast(message) {
    clearTimeout(toastTimer);
    toastEl.textContent = message;
    toastEl.classList.add("show");
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
  }

  function persist(options) {
    const settings = options || {};
    state.updatedAt = nowIso();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (_) {
      showToast("브라우저 저장 공간이 부족합니다. JSON 백업을 먼저 내려받아 주세요.");
      return;
    }
    if (settings.sync === false) return;
    cloud.pending = Boolean(cloud.binId && cloud.key);
    if (cloud.pending) cloud.status = cloudCanPush ? "동기화 대기" : "로컬 저장 · 수동 동기화 필요";
    renderTopOnly();
    if (cloudCanPush) scheduleCloudPush();
  }

  function saveMergedState(nextState) {

    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function subjectById(id) {
    return state.subjects.find((subject) => subject.id === id) || state.subjects[0];
  }

  function categoryById(subject, id) {
    return subject && subject.categories.find((category) => category.id === id);
  }

  function formatDate(dateKey, options) {
    const date = C.parseDateKey(dateKey);
    if (!date) return "";
    return new Intl.DateTimeFormat("ko-KR", options || { month: "long", day: "numeric" }).format(date);
  }

  function formatShortDate(dateKey) {
    const date = C.parseDateKey(dateKey);
    return date ? `${date.getMonth() + 1}.${date.getDate()}` : "";
  }

  function weekRangeLabel(dateValue) {
    const start = C.startOfWeek(dateValue);
    const end = C.endOfWeek(dateValue);
    return `${start.getFullYear()}.${String(start.getMonth() + 1).padStart(2, "0")}.${String(start.getDate()).padStart(2, "0")} — ${end.getFullYear()}.${String(end.getMonth() + 1).padStart(2, "0")}.${String(end.getDate()).padStart(2, "0")}`;
  }

  function render() {
    app.innerHTML = `
      <div class="app-frame">
        ${renderTopbar()}
        <div class="workspace">
          ${renderCommonPanel()}
          <main class="main-content" id="mainContent">
            ${renderPage()}
          </main>
        </div>
        ${renderMobileNav()}
      </div>`;
  }

  function renderTopOnly() {
    const old = document.querySelector(".topbar");
    if (!old) return;
    const holder = document.createElement("div");
    holder.innerHTML = renderTopbar();
    old.replaceWith(holder.firstElementChild);
  }

  function renderTopbar() {
    const pages = [
      ["weekly", "주간"],
      ["monthly", "월간"],
      ["study", "공부량"],

      <header class="topbar">

          <div class="brand-copy">
            <strong class="brand-title-script">민서의 학습 노트</strong>
            <span>STUDY COACHING ARCHIVE</span>

          <button class="sync-pill ${connected ? "connected" : ""}" data-action="open-cloud" title="클라우드 동기화 설정">

  function renderMobileNav() {
    const pages = [
      ["weekly", "▤", "주간"],

      ["study", "▥", "공부량"],
